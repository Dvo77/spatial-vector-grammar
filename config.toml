baseURL = "https://hlsystem.org/"
languageCode = "en-us"
title = "HL System — Human Layer"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true

[params]
  author = "Daniel DeVoy"
    logo = "/hl-icon.svg"
  description = "A free, open-source spatial grammar for making any physical environment machine-readable, human-navigable, and impossible to lose."
  tagline = "Nothing is lost. Everything is logic."
  github = "https://github.com/Dvo77/spatial-vector-grammar"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  disableScrollToTop = false
  comments = false

  [params.homeInfoParams]
    Title = "Nothing is lost. Everything is logic."
    Content = "HL is a free, open-source spatial grammar. Give every object, space, and drawer in your life a permanent address. Works with a piece of tape. Scales to a homelab. Survives you."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Dvo77/spatial-vector-grammar"

[menu]
  [[menu.main]]
    name = "Start Here"
    url = "/start/"
    weight = 1
  [[menu.main]]
    name = "Why"
    url = "/why/"
    weight = 2
  [[menu.main]]
    name = "Grammar"
    url = "/grammar/"
    weight = 3
  [[menu.main]]
    name = "Concepts"
    url = "/concepts/"
    weight = 4
  [[menu.main]]
    name = "Tools"
    url = "/tools/"
    weight = 5
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/Dvo77/spatial-vector-grammar"
    weight = 6
  [[menu.main]]
    name = "Prompts"
    url = "/Prompts/"
    weight = 7

[outputs]
  home = ["HTML", "RSS", "JSON"]
