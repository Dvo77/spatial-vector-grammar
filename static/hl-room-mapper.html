<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HL Room Mapper</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f0e;
  --surface: #141816;
  --surface2: #1c201e;
  --surface3: #222824;
  --border: #2a302c;
  --accent: #4cff91;
  --accent2: #00c9ff;
  --accent3: #ffd84c;
  --danger: #ff5c5c;
  --text: #dde8e2;
  --muted: #6b7d72;
  --mono: 'Share Tech Mono', monospace;
  --head: 'Barlow Condensed', sans-serif;
  --body: 'Barlow', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* HEADER */
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; height: 54px; gap: 0; flex-shrink: 0; }
.logo { display: flex; align-items: center; gap: 10px; margin-right: 28px; }
.logo-box { width: 32px; height: 32px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--head); font-weight: 900; font-size: 15px; color: #000; }
.logo h1 { font-family: var(--head); font-weight: 900; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
.logo span { font-family: var(--mono); font-size: 9px; color: var(--muted); }
.hbtn { background: none; border: 1px solid var(--border); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 5px 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.15s; margin-left: 8px; }
.hbtn:hover { border-color: var(--accent); color: var(--accent); }
.hbtn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: bold; }
.hbtn.primary:hover { background: #6fffaa; }
.hbtn.active { border-color: var(--accent2); color: var(--accent2); }
.header-right { margin-left: auto; display: flex; gap: 6px; align-items: center; }

/* LAYOUT */
.app { display: flex; flex: 1; overflow: hidden; }

/* LEFT PANEL */
.left-panel { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
.panel-section { padding: 16px; border-bottom: 1px solid var(--border); }
.panel-label { font-family: var(--mono); font-size: 9px; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; }

/* STRUCTURE SELECTOR */
.struct-row { display: flex; gap: 6px; margin-bottom: 10px; }
.struct-chip { flex: 1; padding: 8px 4px; background: var(--surface2); border: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; cursor: pointer; letter-spacing: 1px; transition: all 0.12s; }
.struct-chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
.struct-custom { display: flex; gap: 6px; }
.struct-custom input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 13px; padding: 7px 10px; outline: none; text-transform: uppercase; }
.struct-custom input:focus { border-color: var(--accent); }

/* ZONE PALETTE */
.zone-palette { display: flex; flex-direction: column; gap: 6px; }
.zone-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border); cursor: grab; transition: all 0.12s; user-select: none; }
.zone-item:active { cursor: grabbing; opacity: 0.7; }
.zone-item:hover { border-color: var(--accent); }
.zone-color { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
.zone-code { font-family: var(--mono); font-size: 12px; color: var(--accent3); letter-spacing: 1px; min-width: 28px; }
.zone-name { font-size: 12px; color: var(--text); flex: 1; }
.zone-remove { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; padding: 0 2px; line-height: 1; transition: color 0.12s; }
.zone-remove:hover { color: var(--danger); }

.add-zone-row { display: flex; gap: 6px; margin-top: 8px; }
.add-zone-row input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 7px 8px; outline: none; text-transform: uppercase; }
.add-zone-row input:focus { border-color: var(--accent); }
.add-zone-row input:first-child { width: 50px; }
.add-zone-row input:nth-child(2) { flex: 1; font-size: 11px; }
.add-zone-btn { background: var(--accent); border: none; color: #000; font-family: var(--mono); font-size: 12px; font-weight: bold; padding: 7px 12px; cursor: pointer; }

/* GENERATED ADDRESSES */
.addr-list { display: flex; flex-direction: column; gap: 4px; }
.addr-item { padding: 7px 10px; background: var(--surface2); border: 1px solid var(--border); }
.addr-item .addr { font-family: var(--mono); font-size: 12px; color: var(--accent3); letter-spacing: 2px; }
.addr-item .name { font-size: 11px; color: var(--muted); margin-top: 2px; }
.addr-item .shelf-addrs { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.8; }

/* MAIN CANVAS AREA */
.canvas-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.canvas-toolbar { padding: 10px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.tool-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 5px 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.12s; }
.tool-btn:hover { border-color: var(--text); color: var(--text); }
.tool-btn.active { border-color: var(--accent2); color: var(--accent2); }
.grid-size-row { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: auto; }
.grid-size-row select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 10px; padding: 4px 8px; outline: none; }

/* MAP GRID */
.map-scroll { flex: 1; overflow: auto; padding: 20px; }
.map-grid { display: grid; gap: 3px; min-width: fit-content; }
.grid-cell {
  width: 72px; height: 72px;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: all 0.1s;
  user-select: none;
}
.grid-cell:hover { border-color: var(--accent); }
.grid-cell.has-zone { border: 2px solid; }
.grid-cell.has-zone:hover { opacity: 0.85; }
.grid-cell.wall { background: var(--surface); cursor: default; }
.grid-cell.wall:hover { border-color: var(--border); }
.grid-cell.selected { box-shadow: 0 0 0 2px var(--accent2); }
.grid-cell.drag-over { box-shadow: 0 0 0 3px var(--accent); }

.cell-code { font-family: var(--mono); font-size: 11px; font-weight: bold; letter-spacing: 1px; }
.cell-name { font-size: 8px; text-align: center; padding: 0 3px; line-height: 1.3; opacity: 0.8; }
.cell-shelves { font-family: var(--mono); font-size: 8px; color: rgba(255,255,255,0.4); position: absolute; bottom: 3px; right: 4px; }
.cell-wall-icon { font-size: 18px; opacity: 0.2; }
.cell-coord { position: absolute; top: 2px; left: 3px; font-family: var(--mono); font-size: 7px; color: rgba(255,255,255,0.2); }

/* COMPASS */
.compass { position: absolute; top: 24px; right: 24px; width: 48px; height: 48px; pointer-events: none; }
.compass-n { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: bold; }
.compass-s { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 9px; color: var(--muted); }
.compass-e { position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 9px; color: var(--muted); }
.compass-w { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 9px; color: var(--muted); }

/* RIGHT PANEL */
.right-panel { width: 240px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }

/* CELL EDITOR */
.cell-editor { padding: 16px; border-bottom: 1px solid var(--border); }
.cell-editor h3 { font-family: var(--head); font-weight: 900; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.editor-field { margin-bottom: 10px; }
.editor-field label { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 4px; }
.editor-field input, .editor-field select { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 7px 10px; outline: none; transition: border-color 0.15s; }
.editor-field input:focus, .editor-field select:focus { border-color: var(--accent); }

.shelf-builder { margin-top: 8px; }
.shelf-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.shelf-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 11px; padding: 5px 8px; outline: none; }
.shelf-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 3px; }
.shelf-remove:hover { color: var(--danger); }
.add-shelf-btn { background: none; border: 1px dashed var(--border); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 5px; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.12s; margin-top: 4px; }
.add-shelf-btn:hover { border-color: var(--accent); color: var(--accent); }

.apply-btn { width: 100%; background: var(--accent); border: none; color: #000; font-family: var(--head); font-weight: 900; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; padding: 10px; cursor: pointer; margin-top: 10px; transition: background 0.15s; }
.apply-btn:hover { background: #6fffaa; }
.clear-cell-btn { width: 100%; background: none; border: 1px solid var(--border); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 7px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; transition: all 0.12s; }
.clear-cell-btn:hover { border-color: var(--danger); color: var(--danger); }

/* EXPORT PANEL */
.export-panel { padding: 16px; }
.export-panel h3 { font-family: var(--head); font-weight: 900; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.exp-btn { width: 100%; background: none; border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 11px; padding: 9px 10px; cursor: pointer; text-align: left; letter-spacing: 1px; transition: all 0.12s; margin-bottom: 6px; }
.exp-btn:hover { border-color: var(--accent); color: var(--accent); }
.exp-btn span { float: right; color: var(--muted); }

/* TOAST */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface); border: 1px solid var(--accent); color: var(--accent); font-family: var(--mono); font-size: 12px; padding: 10px 20px; letter-spacing: 1px; z-index: 9999; opacity: 0; transition: all 0.25s; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); width: 500px; max-width: 95vw; max-height: 80vh; display: flex; flex-direction: column; }
.modal-hdr { padding: 14px 18px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-hdr h3 { font-family: var(--head); font-weight: 900; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
.modal-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.code-out { background: var(--bg); border: 1px solid var(--border); padding: 14px; font-family: var(--mono); font-size: 12px; color: #a8c8b0; line-height: 1.8; white-space: pre; overflow-x: auto; max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-box">HL</div>
    <div>
      <h1>Room Mapper</h1>
      <span>Human Layer System</span>
    </div>
  </div>
  <div class="header-right">
    <button class="hbtn" onclick="clearMap()">Clear Map</button>
    <button class="hbtn" onclick="loadExample()">Load Example</button>
    <button class="hbtn" onclick="showExportModal()">Export Addresses</button>
    <button class="hbtn primary" onclick="sendToVault()">Save All to Vault →</button>
  </div>
</header>

<div class="app">

  <!-- LEFT PANEL -->
  <div class="left-panel">

    <!-- STRUCTURE -->
    <div class="panel-section">
      <div class="panel-label">Structure Code</div>
      <div class="struct-row">
        <div class="struct-chip active" onclick="setStruct('HM',this)">HM</div>
        <div class="struct-chip" onclick="setStruct('GR',this)">GR</div>
        <div class="struct-chip" onclick="setStruct('SH',this)">SH</div>
        <div class="struct-chip" onclick="setStruct('YD',this)">YD</div>
      </div>
      <div class="struct-custom">
        <input type="text" id="custom-struct" placeholder="Custom…" maxlength="4" oninput="this.value=this.value.toUpperCase()">
        <button class="hbtn" onclick="setStructCustom()">Use</button>
      </div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--accent);margin-top:8px;letter-spacing:2px" id="struct-display">STRUCTURE: HM</div>
    </div>

    <!-- ZONE PALETTE -->
    <div class="panel-section" style="flex:1">
      <div class="panel-label">Zone Palette — Drag to Map</div>
      <div class="zone-palette" id="zone-palette"></div>
      <div class="add-zone-row">
        <input type="text" id="new-zone-code" placeholder="WS" maxlength="4">
        <input type="text" id="new-zone-name" placeholder="Workshop">
        <button class="add-zone-btn" onclick="addZone()">+</button>
      </div>
    </div>

    <!-- GENERATED ADDRESSES -->
    <div class="panel-section">
      <div class="panel-label">Generated Addresses <span id="addr-count" style="color:var(--muted)">(0)</span></div>
      <div class="addr-list" id="addr-list"></div>
    </div>

  </div>

  <!-- MAP CANVAS -->
  <div class="canvas-area">
    <div class="canvas-toolbar">
      <button class="tool-btn active" id="tool-paint" onclick="setTool('paint')">🎨 Paint Zone</button>
      <button class="tool-btn" id="tool-wall" onclick="setTool('wall')">🧱 Wall</button>
      <button class="tool-btn" id="tool-erase" onclick="setTool('erase')">⬜ Erase</button>
      <button class="tool-btn" id="tool-select" onclick="setTool('select')">↖ Select</button>
      <div class="grid-size-row">
        Grid:
        <select onchange="resizeGrid(this.value)">
          <option value="6x6">6 × 6</option>
          <option value="8x8" selected>8 × 8</option>
          <option value="10x10">10 × 10</option>
          <option value="12x12">12 × 12</option>
          <option value="16x10">16 × 10</option>
          <option value="20x12">20 × 12</option>
        </select>
      </div>
    </div>

    <div class="map-scroll" style="position:relative">
      <div style="position:relative;display:inline-block">
        <div class="map-grid" id="map-grid"></div>
        <div class="compass">
          <div class="compass-n">N</div>
          <div class="compass-s">S</div>
          <div class="compass-e">E</div>
          <div class="compass-w">W</div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">

    <!-- CELL EDITOR -->
    <div class="cell-editor" id="cell-editor">
      <h3>Cell Editor</h3>
      <div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:12px" id="selected-cell-info">Click a cell to edit it</div>

      <div id="editor-fields" style="display:none">
        <div class="editor-field">
          <label>Zone Code</label>
          <input type="text" id="ed-zone" maxlength="4" oninput="this.value=this.value.toUpperCase()">
        </div>
        <div class="editor-field">
          <label>Zone Name</label>
          <input type="text" id="ed-name">
        </div>
        <div class="editor-field">
          <label>Section Override</label>
          <input type="text" id="ed-section" placeholder="e.g. S1, NW (auto if blank)" maxlength="4" oninput="this.value=this.value.toUpperCase()">
        </div>

        <div class="shelf-builder">
          <div style="font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px">Shelves / Mounts</div>
          <div id="shelf-rows"></div>
          <button class="add-shelf-btn" onclick="addShelfRow()">+ Add Shelf</button>
        </div>

        <button class="apply-btn" onclick="applyCell()">Apply ✓</button>
        <button class="clear-cell-btn" onclick="clearCell()">Clear Cell</button>
      </div>
    </div>

    <!-- EXPORT -->
    <div class="export-panel">
      <h3>Export</h3>
      <button class="exp-btn" onclick="copyAddresses()">Copy All Addresses <span>📋</span></button>
      <button class="exp-btn" onclick="showExportModal()">View Full List <span>↗</span></button>
      <button class="exp-btn" onclick="sendToVault()">Save to Vault <span>🗄</span></button>
      <button class="exp-btn" onclick="exportJSON()">Download JSON <span>↓</span></button>
    </div>

  </div>

</div>

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="modal-export">
  <div class="modal">
    <div class="modal-hdr">
      <h3>Generated Addresses</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <pre class="code-out" id="export-text"></pre>
    </div>
    <div class="modal-footer">
      <button class="hbtn" onclick="closeModal()">Close</button>
      <button class="hbtn primary" onclick="copyExport()">Copy All</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let gridW = 8, gridH = 8;
let cells = []; // [{zone, name, section, shelves, wall}]
let activeTool = 'paint';
let selectedCell = null;
let activeZone = null;
let structCode = 'HM';
let isPainting = false;

const ZONE_COLORS = [
  '#4cff91','#00c9ff','#ffd84c','#ff9ecd','#a0c4a0',
  '#c4a0ff','#ffb347','#87ceeb','#ff7070','#90ee90'
];

let zones = [
  { code: 'WS', name: 'Workshop', color: ZONE_COLORS[0] },
  { code: 'LR', name: 'Living Room', color: ZONE_COLORS[1] },
  { code: 'KT', name: 'Kitchen', color: ZONE_COLORS[2] },
  { code: 'BD', name: 'Bedroom', color: ZONE_COLORS[3] },
  { code: 'BA', name: 'Bathroom', color: ZONE_COLORS[4] },
  { code: 'ST', name: 'Storage', color: ZONE_COLORS[5] },
];

// ══════════════════════════════════════
// GRID
// ══════════════════════════════════════
function initGrid(w, h) {
  gridW = w; gridH = h;
  cells = Array(w * h).fill(null).map(() => ({ zone: null, name: '', section: '', shelves: [], wall: false }));
  renderGrid();
  renderAddresses();
}

function resizeGrid(val) {
  const [w, h] = val.split('x').map(Number);
  if (confirm(`Resize to ${w}×${h}? Current layout will be cleared.`)) initGrid(w, h);
}

function renderGrid() {
  const grid = document.getElementById('map-grid');
  grid.style.gridTemplateColumns = `repeat(${gridW}, 72px)`;
  grid.innerHTML = '';

  cells.forEach((cell, i) => {
    const col = i % gridW;
    const row = Math.floor(i / gridW);
    const div = document.createElement('div');
    div.className = 'grid-cell' + (cell.wall ? ' wall' : '') + (cell.zone ? ' has-zone' : '') + (selectedCell === i ? ' selected' : '');
    div.dataset.idx = i;

    if (cell.wall) {
      div.innerHTML = `<span class="cell-wall-icon">█</span>`;
    } else if (cell.zone) {
      const z = zones.find(z => z.code === cell.zone);
      const color = z ? z.color : '#888';
      div.style.borderColor = color;
      div.style.background = color + '18';
      div.innerHTML = `
        <span class="cell-coord">${col+1},${row+1}</span>
        <span class="cell-code" style="color:${color}">${cell.zone}</span>
        <span class="cell-name" style="color:${color}">${cell.name || z?.name || ''}</span>
        ${cell.shelves.length ? `<span class="cell-shelves">${cell.shelves.length}S</span>` : ''}
      `;
    } else {
      div.innerHTML = `<span class="cell-coord" style="opacity:0.15">${col+1},${row+1}</span>`;
    }

    div.addEventListener('mousedown', e => { e.preventDefault(); isPainting = true; handleCellInteract(i); });
    div.addEventListener('mouseover', () => { if (isPainting) handleCellPaint(i); div.classList.add('drag-over'); });
    div.addEventListener('mouseleave', () => div.classList.remove('drag-over'));
    div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop', e => { e.preventDefault(); div.classList.remove('drag-over'); handleDrop(i, e); });

    grid.appendChild(div);
  });

  document.addEventListener('mouseup', () => isPainting = false, { once: false });
}

function handleCellInteract(i) {
  if (activeTool === 'paint' && activeZone) {
    const z = zones.find(z => z.code === activeZone);
    cells[i] = { zone: activeZone, name: z?.name || '', section: '', shelves: [], wall: false };
    renderGrid();
    renderAddresses();
  } else if (activeTool === 'wall') {
    cells[i] = { zone: null, name: '', section: '', shelves: [], wall: true };
    renderGrid();
    renderAddresses();
  } else if (activeTool === 'erase') {
    cells[i] = { zone: null, name: '', section: '', shelves: [], wall: false };
    renderGrid();
    renderAddresses();
  } else if (activeTool === 'select') {
    selectCell(i);
  }
}

function handleCellPaint(i) {
  if (activeTool === 'paint' && activeZone) {
    const z = zones.find(z => z.code === activeZone);
    cells[i] = { zone: activeZone, name: z?.name || '', section: '', shelves: [], wall: false };
    renderGrid();
    renderAddresses();
  } else if (activeTool === 'wall') {
    cells[i] = { zone: null, name: '', section: '', shelves: [], wall: true };
    renderGrid();
    renderAddresses();
  } else if (activeTool === 'erase') {
    cells[i] = { zone: null, name: '', section: '', shelves: [], wall: false };
    renderGrid();
    renderAddresses();
  }
}

function handleDrop(i, e) {
  const code = e.dataTransfer.getData('zone-code');
  if (!code) return;
  const z = zones.find(z => z.code === code);
  cells[i] = { zone: code, name: z?.name || '', section: '', shelves: [], wall: false };
  setActiveZone(code);
  renderGrid();
  renderAddresses();
}

function selectCell(i) {
  selectedCell = i;
  const cell = cells[i];
  document.getElementById('selected-cell-info').textContent = `Cell ${(i%gridW)+1},${Math.floor(i/gridW)+1} — ${cell.zone ? getFullAddress(i) : 'empty'}`;
  document.getElementById('editor-fields').style.display = cell.wall ? 'none' : 'block';

  if (!cell.wall) {
    document.getElementById('ed-zone').value = cell.zone || '';
    document.getElementById('ed-name').value = cell.name || '';
    document.getElementById('ed-section').value = cell.section || '';
    renderShelfRows(cell.shelves);
  }
  renderGrid();
}

function applyCell() {
  if (selectedCell === null) return;
  const zone = document.getElementById('ed-zone').value.trim().toUpperCase();
  if (!zone) { showToast('Enter a zone code'); return; }
  cells[selectedCell] = {
    zone,
    name: document.getElementById('ed-name').value,
    section: document.getElementById('ed-section').value.toUpperCase(),
    shelves: getShelfValues(),
    wall: false
  };
  renderGrid();
  renderAddresses();
  showToast('Cell updated');
}

function clearCell() {
  if (selectedCell === null) return;
  cells[selectedCell] = { zone: null, name: '', section: '', shelves: [], wall: false };
  selectedCell = null;
  document.getElementById('selected-cell-info').textContent = 'Click a cell to edit it';
  document.getElementById('editor-fields').style.display = 'none';
  renderGrid();
  renderAddresses();
}

// ══════════════════════════════════════
// SHELF BUILDER
// ══════════════════════════════════════
function renderShelfRows(shelves) {
  const container = document.getElementById('shelf-rows');
  container.innerHTML = (shelves||[]).map((s,i) => `
    <div class="shelf-row">
      <input type="text" value="${s}" placeholder="A0, B1, M0…" oninput="updateShelf(${i},this.value)" style="text-transform:uppercase">
      <button class="shelf-remove" onclick="removeShelf(${i})">✕</button>
    </div>
  `).join('');
}

function addShelfRow() {
  const letters = 'ABCDEFGHIJKLMNOP';
  const current = getShelfValues();
  const next = letters[current.length] + '0';
  current.push(next);
  renderShelfRows(current);
}

function getShelfValues() {
  return [...document.querySelectorAll('#shelf-rows input')].map(i => i.value.toUpperCase()).filter(Boolean);
}

function updateShelf(idx, val) {} // live via getShelfValues
function removeShelf(idx) {
  const vals = getShelfValues();
  vals.splice(idx, 1);
  renderShelfRows(vals);
}

// ══════════════════════════════════════
// ADDRESS GENERATION
// ══════════════════════════════════════
function getAutoSection(i) {
  const col = i % gridW;
  const row = Math.floor(i / gridW);
  // Divide into quadrants for section naming
  const colHalf = col < gridW/2 ? 'W' : 'E';
  const rowHalf = row < gridH/2 ? 'N' : 'S';
  const secNum = Math.floor(col / 2) + 1;
  return `${rowHalf}${secNum}`;
}

function getFullAddress(i) {
  const cell = cells[i];
  if (!cell.zone) return null;
  const section = cell.section || getAutoSection(i);
  return `${structCode}-${cell.zone}-${section}`;
}

function renderAddresses() {
  // Group cells by zone
  const zoneMap = {};
  cells.forEach((cell, i) => {
    if (!cell.zone) return;
    const addr = getFullAddress(i);
    if (!zoneMap[cell.zone]) zoneMap[cell.zone] = { name: cell.name, addrs: new Set(), shelves: cell.shelves };
    zoneMap[cell.zone].addrs.add(addr);
    if (cell.shelves.length) zoneMap[cell.zone].shelves = cell.shelves;
  });

  const list = document.getElementById('addr-list');
  const entries = Object.entries(zoneMap);
  document.getElementById('addr-count').textContent = `(${entries.length})`;

  if (!entries.length) { list.innerHTML = '<div style="font-family:var(--mono);font-size:11px;color:var(--muted)">Paint zones on the map to generate addresses</div>'; return; }

  list.innerHTML = entries.map(([code, data]) => {
    const addrs = [...data.addrs].sort();
    const shelfAddrs = data.shelves.length ? addrs.flatMap(a => data.shelves.map(s => `${a}-${s}`)) : [];
    return `
      <div class="addr-item">
        <div class="addr">${structCode}-${code}</div>
        <div class="name">${data.name}</div>
        ${shelfAddrs.length ? `<div class="shelf-addrs">${shelfAddrs.join('\n')}</div>` : ''}
      </div>`;
  }).join('');
}

function getAllAddresses() {
  const zoneMap = {};
  cells.forEach((cell, i) => {
    if (!cell.zone) return;
    const baseAddr = `${structCode}-${cell.zone}`;
    const sectionAddr = getFullAddress(i);
    if (!zoneMap[cell.zone]) zoneMap[cell.zone] = { name: cell.name, sections: new Set(), shelves: cell.shelves };
    zoneMap[cell.zone].sections.add(sectionAddr);
    if (cell.shelves.length) zoneMap[cell.zone].shelves = cell.shelves;
  });

  const lines = [];
  Object.entries(zoneMap).forEach(([code, data]) => {
    lines.push(`${structCode}-${code}  →  ${data.name}`);
    const sections = [...data.sections].sort();
    sections.forEach(s => {
      lines.push(`  ${s}`);
      if (data.shelves.length) {
        data.shelves.forEach(sh => lines.push(`    ${s}-${sh}`));
      }
    });
    lines.push('');
  });

  return lines.join('\n');
}

// ══════════════════════════════════════
// ZONE PALETTE
// ══════════════════════════════════════
function renderZonePalette() {
  const palette = document.getElementById('zone-palette');
  palette.innerHTML = zones.map((z, i) => `
    <div class="zone-item ${activeZone === z.code ? 'selected' : ''}"
      draggable="true"
      onclick="setActiveZone('${z.code}')"
      ondragstart="event.dataTransfer.setData('zone-code','${z.code}')"
      style="${activeZone === z.code ? 'border-color:'+z.color+';background:'+z.color+'18' : ''}">
      <div class="zone-color" style="background:${z.color}"></div>
      <span class="zone-code">${z.code}</span>
      <span class="zone-name">${z.name}</span>
      <button class="zone-remove" onclick="event.stopPropagation();removeZone(${i})">✕</button>
    </div>
  `).join('');
}

function setActiveZone(code) {
  activeZone = code;
  if (activeTool !== 'paint') setTool('paint');
  renderZonePalette();
}

function addZone() {
  const code = document.getElementById('new-zone-code').value.trim().toUpperCase();
  const name = document.getElementById('new-zone-name').value.trim();
  if (!code) { showToast('Enter a zone code'); return; }
  if (zones.find(z => z.code === code)) { showToast('Zone code already exists'); return; }
  const color = ZONE_COLORS[zones.length % ZONE_COLORS.length];
  zones.push({ code, name: name || code, color });
  document.getElementById('new-zone-code').value = '';
  document.getElementById('new-zone-name').value = '';
  renderZonePalette();
  setActiveZone(code);
  showToast(`Zone ${code} added`);
}

function removeZone(idx) {
  const code = zones[idx].code;
  zones.splice(idx, 1);
  // Clear cells with this zone
  cells.forEach(c => { if (c.zone === code) c.zone = null; });
  if (activeZone === code) activeZone = zones[0]?.code || null;
  renderZonePalette();
  renderGrid();
  renderAddresses();
}

// ══════════════════════════════════════
// TOOLS & STRUCT
// ══════════════════════════════════════
function setTool(tool) {
  activeTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tool-' + tool).classList.add('active');
}

function setStruct(code, el) {
  structCode = code;
  document.querySelectorAll('.struct-chip').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('struct-display').textContent = `STRUCTURE: ${code}`;
  document.getElementById('custom-struct').value = '';
  renderAddresses();
}

function setStructCustom() {
  const val = document.getElementById('custom-struct').value.trim().toUpperCase();
  if (!val) return;
  structCode = val;
  document.querySelectorAll('.struct-chip').forEach(c => c.classList.remove('active'));
  document.getElementById('struct-display').textContent = `STRUCTURE: ${val}`;
  renderAddresses();
}

// ══════════════════════════════════════
// EXPORT & VAULT
// ══════════════════════════════════════
function showExportModal() {
  document.getElementById('export-text').textContent = getAllAddresses();
  document.getElementById('modal-export').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-export').classList.remove('open');
}

function copyExport() {
  navigator.clipboard.writeText(document.getElementById('export-text').textContent)
    .then(() => showToast('Copied!'));
}

function copyAddresses() {
  navigator.clipboard.writeText(getAllAddresses()).then(() => showToast('Addresses copied'));
}

function sendToVault() {
  const VAULT_KEY = 'hl_vault_v1';
  let vault = [];
  try { vault = JSON.parse(localStorage.getItem(VAULT_KEY)) || []; } catch {}

  const zoneMap = {};
  cells.forEach((cell, i) => {
    if (!cell.zone || cell.wall) return;
    const key = cell.zone;
    if (!zoneMap[key]) zoneMap[key] = { name: cell.name, sections: new Set(), shelves: cell.shelves, idx: i };
    zoneMap[key].sections.add(getFullAddress(i));
    if (cell.shelves.length) zoneMap[key].shelves = cell.shelves;
  });

  let added = 0;
  Object.entries(zoneMap).forEach(([code, data]) => {
    const baseAddr = `${structCode}-${code}`;
    // Add zone record
    if (!vault.find(r => r.address === baseAddr)) {
      vault.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,5) + added,
        address: baseAddr,
        itemName: `ZONE-${code}`,
        friendlyName: data.name || code,
        category: 'ZONE',
        make: '', model: '', condition: '', value: '', haType: '', notes: `Mapped via HL Room Mapper`,
        created: Date.now(), updated: Date.now()
      });
      added++;
    }
    // Add shelf records
    data.shelves.forEach(shelf => {
      const sections = [...data.sections];
      sections.forEach(sec => {
        const shelfAddr = `${sec}-${shelf}`;
        if (!vault.find(r => r.address === shelfAddr)) {
          vault.unshift({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2,5) + added,
            address: shelfAddr,
            itemName: `LOCATION-SHELF-${shelf}`,
            friendlyName: `${data.name || code} — Shelf ${shelf}`,
            category: 'ZONE',
            make: '', model: '', condition: '', value: '', haType: '', notes: `Mapped via HL Room Mapper`,
            created: Date.now(), updated: Date.now()
          });
          added++;
        }
      });
    });
  });

  localStorage.setItem(VAULT_KEY, JSON.stringify(vault));
  showToast(`${added} addresses saved to Vault`);
}

function exportJSON() {
  const data = { structure: structCode, gridW, gridH, zones, cells, generated: getAllAddresses(), date: new Date().toISOString() };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:'application/json'}));
  a.download = `hl-map-${structCode.toLowerCase()}.json`;
  a.click();
  showToast('Map exported');
}

function clearMap() {
  if (!confirm('Clear the entire map?')) return;
  initGrid(gridW, gridH);
  showToast('Map cleared');
}

// ══════════════════════════════════════
// TOAST
// ══════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
renderZonePalette();
initGrid(8, 8);
setActiveZone('WS');
</script>
