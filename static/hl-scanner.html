<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HL Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #0a0c0b;
  --surface: #141816;
  --surface2: #1c201e;
  --border: #2a302c;
  --accent: #4cff91;
  --accent2: #00c9ff;
  --accent3: #ffd84c;
  --danger: #ff5c5c;
  --text: #dde8e2;
  --muted: #6b7d72;
  --mono: 'Share Tech Mono', monospace;
  --head: 'Barlow Condensed', sans-serif;
  --body: 'Barlow', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  overflow: hidden;
  touch-action: manipulation;
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 58px;
}

.logo { display: flex; align-items: center; gap: 10px; }
.logo-box { width: 32px; height: 32px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--head); font-weight: 900; font-size: 15px; color: #000; }
.logo h1 { font-family: var(--head); font-weight: 900; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
.logo span { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 1px; display: block; }

.vault-count { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; }
.vault-count strong { color: var(--accent); font-size: 16px; display: block; line-height: 1; }

/* ── MAIN SCROLL AREA ── */
.scroll-area {
  position: fixed;
  top: 58px;
  bottom: calc(72px + var(--safe-bottom));
  left: 0; right: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ── SCREENS ── */
.screen { display: none; padding: 16px; }
.screen.active { display: block; }

/* ── SEARCH SCREEN ── */
.search-hero {
  text-align: center;
  padding: 24px 0 20px;
}

.search-hero h2 {
  font-family: var(--head);
  font-weight: 900;
  font-size: 32px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 4px;
}

.search-hero p {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
}

.search-box {
  position: relative;
  margin-bottom: 12px;
}

.search-box input {
  width: 100%;
  background: var(--surface);
  border: 2px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 22px;
  padding: 16px 56px 16px 16px;
  outline: none;
  letter-spacing: 3px;
  text-transform: uppercase;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}

.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { font-size: 16px; letter-spacing: 1px; text-transform: none; color: var(--muted); }

.search-box .mic-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  padding: 8px;
  color: var(--muted);
  transition: color 0.15s;
}

.search-box .mic-btn.listening { color: var(--danger); animation: pulse 1s infinite; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.search-btn {
  width: 100%;
  background: var(--accent);
  border: none;
  color: #000;
  font-family: var(--head);
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 18px;
  cursor: pointer;
  margin-bottom: 12px;
  transition: background 0.15s;
  -webkit-appearance: none;
}

.search-btn:active { background: #6fffaa; }

/* QUICK ADDR BUILDER */
.quick-builder {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 14px;
  margin-bottom: 12px;
}

.quick-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

.seg-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}

.seg-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 16px;
  padding: 10px 6px;
  text-align: center;
  text-transform: uppercase;
  outline: none;
  width: 100%;
  -webkit-appearance: none;
  transition: border-color 0.15s;
}

.seg-input:focus { border-color: var(--accent); }

.seg-labels {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}

.seg-lbl {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: center;
}

.addr-built {
  background: var(--bg);
  border: 1px solid var(--accent);
  padding: 10px;
  font-family: var(--mono);
  font-size: 20px;
  color: var(--accent);
  text-align: center;
  letter-spacing: 4px;
  margin-bottom: 10px;
}

.use-addr-btn {
  width: 100%;
  background: none;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 13px;
  padding: 10px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: all 0.15s;
  -webkit-appearance: none;
}

.use-addr-btn:active { background: var(--accent); color: #000; }

/* RECENT SEARCHES */
.recent-section { margin-top: 8px; }
.section-head {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.clear-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
}

.recent-chip {
  display: inline-block;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--accent3);
  font-family: var(--mono);
  font-size: 13px;
  padding: 7px 12px;
  margin: 0 6px 6px 0;
  cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.12s;
}

.recent-chip:active { background: var(--surface2); border-color: var(--accent3); }

/* ── RESULT SCREEN ── */
.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 12px;
}

.result-addr-bar {
  background: var(--surface2);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.result-addr {
  font-family: var(--mono);
  font-size: 28px;
  color: var(--accent3);
  letter-spacing: 4px;
  font-weight: bold;
}

.result-badge {
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 3px 8px;
  border: 1px solid;
}

.result-body { padding: 16px; }

.result-name {
  font-family: var(--head);
  font-weight: 900;
  font-size: 26px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 4px;
  line-height: 1.1;
}

.result-item {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 14px;
  word-break: break-all;
}

.result-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.meta-field label {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 2px;
  display: block;
  margin-bottom: 2px;
}

.meta-field .val {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
}

.meta-field .val.green { color: var(--accent); }

.result-notes {
  background: var(--surface2);
  border-left: 3px solid var(--accent);
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.6;
  margin-bottom: 14px;
  display: none;
}

.result-notes.show { display: block; }

.toggle-notes {
  background: none;
  border: none;
  color: var(--accent2);
  font-family: var(--mono);
  font-size: 11px;
  cursor: pointer;
  padding: 0 0 12px;
  text-decoration: underline;
  display: block;
}

.result-qr {
  display: flex;
  justify-content: center;
  padding: 12px 0;
  border-top: 1px solid var(--border);
}

.result-qr canvas, .result-qr img {
  width: 120px !important;
  height: 120px !important;
}

/* ACTION ROW */
.action-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.action-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--head);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 16px 8px;
  cursor: pointer;
  text-align: center;
  transition: all 0.12s;
  -webkit-appearance: none;
}

.action-btn:active { background: var(--surface2); }
.action-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
.action-btn.primary:active { background: #6fffaa; }
.action-btn .icon { font-size: 20px; display: block; margin-bottom: 2px; }

.back-btn {
  width: 100%;
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
  padding: 12px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
  -webkit-appearance: none;
}

/* NOT FOUND */
.not-found {
  text-align: center;
  padding: 32px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 12px;
}

.not-found .big { font-size: 48px; margin-bottom: 12px; }
.not-found h3 { font-family: var(--head); font-weight: 900; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; color: #fff; margin-bottom: 6px; }
.not-found p { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }

.add-quick-btn {
  width: 100%;
  background: var(--accent);
  border: none;
  color: #000;
  font-family: var(--head);
  font-weight: 900;
  font-size: 18px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 16px;
  cursor: pointer;
  -webkit-appearance: none;
}

/* QUICK ADD FORM */
.quick-add-form {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 16px;
  margin-bottom: 12px;
}

.quick-add-form h3 {
  font-family: var(--head);
  font-weight: 900;
  font-size: 20px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
}

.qf-field { margin-bottom: 10px; }
.qf-field label { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 4px; }
.qf-field input, .qf-field select, .qf-field textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  padding: 10px 12px;
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.15s;
}

.qf-field input:focus, .qf-field select:focus, .qf-field textarea:focus { border-color: var(--accent); }
.qf-field textarea { min-height: 60px; resize: vertical; }
.qf-field select option { background: var(--surface2); }

.save-quick-btn {
  width: 100%;
  background: var(--accent);
  border: none;
  color: #000;
  font-family: var(--head);
  font-weight: 900;
  font-size: 18px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 16px;
  cursor: pointer;
  margin-top: 6px;
  -webkit-appearance: none;
}

/* ALL RECORDS SCREEN */
.all-list .list-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom: none;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: background 0.12s;
}

.all-list .list-item:last-child { border-bottom: 1px solid var(--border); }
.all-list .list-item:active { background: var(--surface2); }

.list-addr {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--accent3);
  letter-spacing: 2px;
  white-space: nowrap;
  min-width: 90px;
}

.list-name {
  flex: 1;
  overflow: hidden;
}

.list-name-main { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-name-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.list-arrow { color: var(--muted); font-size: 16px; }

/* TOAST */
.toast {
  position: fixed;
  bottom: calc(80px + var(--safe-bottom));
  left: 16px; right: 16px;
  background: var(--surface);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 13px;
  padding: 12px 16px;
  letter-spacing: 1px;
  z-index: 9999;
  text-align: center;
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
}

.toast.show { transform: translateY(0); opacity: 1; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  height: calc(72px + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  z-index: 100;
}

.nav-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: color 0.15s;
  padding: 0;
  -webkit-appearance: none;
}

.nav-btn .nav-icon { font-size: 22px; }
.nav-btn.active { color: var(--accent); }
.nav-btn:active { color: var(--text); }

/* ── LISTENING OVERLAY ── */
.listen-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}

.listen-overlay.open { display: flex; }

.listen-ring {
  width: 120px; height: 120px;
  border: 3px solid var(--danger);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  animation: ring-pulse 1.2s infinite;
}

@keyframes ring-pulse {
  0%,100%{ box-shadow: 0 0 0 0 rgba(255,92,92,0.4); }
  50%{ box-shadow: 0 0 0 20px rgba(255,92,92,0); }
}

.listen-text { font-family: var(--mono); font-size: 14px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.listen-cancel { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; background: none; border: none; color: var(--muted); padding: 8px; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <div class="logo-box">HL</div>
    <div>
      <h1>Scanner</h1>
      <span>Human Layer System</span>
    </div>
  </div>
  <div class="vault-count">
    <strong id="hdr-count">0</strong>
    records
  </div>
</header>

<!-- SCROLL AREA -->
<div class="scroll-area">

  <!-- SEARCH SCREEN -->
  <div class="screen active" id="screen-search">
    <div class="search-hero">
      <h2>Find It</h2>
      <p>Enter an HL address to look up a record</p>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="e.g. GR-WS-S2-A1"
        autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"
        oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="mic-btn" id="mic-btn" onclick="startVoice()">🎤</button>
    </div>

    <button class="search-btn" onclick="doSearch()">⌕ Look Up</button>

    <!-- Quick Builder -->
    <div class="quick-builder">
      <div class="quick-label">Quick Address Builder</div>
      <div class="seg-row">
        <input class="seg-input" id="q-struct" placeholder="HM" maxlength="4" oninput="this.value=this.value.toUpperCase();buildQuickAddr()">
        <input class="seg-input" id="q-zone" placeholder="WS" maxlength="4" oninput="this.value=this.value.toUpperCase();buildQuickAddr()">
        <input class="seg-input" id="q-sec" placeholder="S2" maxlength="4" oninput="this.value=this.value.toUpperCase();buildQuickAddr()">
        <input class="seg-input" id="q-shelf" placeholder="A1" maxlength="4" oninput="this.value=this.value.toUpperCase();buildQuickAddr()">
      </div>
      <div class="seg-labels">
        <span class="seg-lbl">Structure</span>
        <span class="seg-lbl">Zone</span>
        <span class="seg-lbl">Section</span>
        <span class="seg-lbl">Shelf</span>
      </div>
      <div class="addr-built" id="quick-addr-preview">—</div>
      <button class="use-addr-btn" onclick="useQuickAddr()">Use This Address →</button>
    </div>

    <!-- Recent searches -->
    <div class="recent-section" id="recent-section">
      <div class="section-head">
        Recent
        <button class="clear-btn" onclick="clearRecent()">Clear</button>
      </div>
      <div id="recent-chips"></div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen" id="screen-result">
    <button class="back-btn" onclick="goBack()">← Back to Search</button>
    <div id="result-content"></div>
  </div>

  <!-- ALL RECORDS SCREEN -->
  <div class="screen" id="screen-all">
    <div style="padding-bottom:12px">
      <input type="text" id="all-search"
        style="width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:14px;padding:12px 14px;outline:none;margin-bottom:8px"
        placeholder="Filter records…" oninput="renderAllList()" autocorrect="off" autocapitalize="off">
    </div>
    <div class="all-list" id="all-list"></div>
    <div id="all-empty" style="display:none;text-align:center;padding:40px 16px;font-family:var(--mono);font-size:12px;color:var(--muted)">
      No records in vault yet.<br>Add one from the search screen.
    </div>
  </div>

</div><!-- end scroll area -->

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-search" onclick="showScreen('search')">
    <span class="nav-icon">⌕</span>
    Search
  </button>
  <button class="nav-btn" id="nav-all" onclick="showScreen('all')">
    <span class="nav-icon">📦</span>
    All Records
  </button>
  <button class="nav-btn" id="nav-vault" onclick="openVault()">
    <span class="nav-icon">🗄</span>
    Full Vault
  </button>
</nav>

<!-- VOICE LISTENING OVERLAY -->
<div class="listen-overlay" id="listen-overlay">
  <div class="listen-ring">🎤</div>
  <div class="listen-text">Listening… say an HL address</div>
  <button class="listen-cancel" onclick="stopVoice()">Cancel</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════
// VAULT DATA
// ══════════════════════════════════════
const VAULT_KEY = 'hl_vault_v1';

function loadVault() {
  try { return JSON.parse(localStorage.getItem(VAULT_KEY)) || []; }
  catch { return []; }
}

function saveVault(records) {
  localStorage.setItem(VAULT_KEY, JSON.stringify(records));
  updateHeader();
}

let records = loadVault();

function updateHeader() {
  records = loadVault();
  document.getElementById('hdr-count').textContent = records.length;
}

// ══════════════════════════════════════
// RECENT SEARCHES
// ══════════════════════════════════════
const RECENT_KEY = 'hl_scanner_recent';

function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; }
  catch { return []; }
}

function addRecent(addr) {
  let r = getRecent().filter(x => x !== addr);
  r.unshift(addr);
  r = r.slice(0, 8);
  localStorage.setItem(RECENT_KEY, JSON.stringify(r));
  renderRecent();
}

function clearRecent() {
  localStorage.removeItem(RECENT_KEY);
  renderRecent();
}

function renderRecent() {
  const recent = getRecent();
  const sec = document.getElementById('recent-section');
  const chips = document.getElementById('recent-chips');
  if (!recent.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  chips.innerHTML = recent.map(a =>
    `<span class="recent-chip" onclick="searchAddr('${a}')">${a}</span>`
  ).join('');
}

// ══════════════════════════════════════
// SEARCH
// ══════════════════════════════════════
function doSearch() {
  const val = document.getElementById('search-input').value.trim().toUpperCase();
  if (!val) { showToast('Enter an address to search'); return; }
  searchAddr(val);
}

function searchAddr(addr) {
  records = loadVault();
  document.getElementById('search-input').value = addr;
  addRecent(addr);

  // Find exact or partial match
  const exact = records.find(r => r.address === addr);
  const partials = exact ? [] : records.filter(r => r.address.startsWith(addr) && r.address !== addr);

  showScreen('result');
  renderResult(addr, exact, partials);
}

function renderResult(addr, record, partials) {
  const el = document.getElementById('result-content');

  if (record) {
    // FOUND
    const catClass = record.category || 'OTHER';
    el.innerHTML = `
      <div class="result-card">
        <div class="result-addr-bar">
          <div class="result-addr">${addr}</div>
          <span class="result-badge cat-pill cat-${catClass}">${catClass}</span>
        </div>
        <div class="result-body">
          <div class="result-name">${record.friendlyName || record.itemName || '—'}</div>
          <div class="result-item">${record.itemName || '—'}</div>
          <div class="result-meta">
            <div class="meta-field"><label>Make</label><div class="val">${record.make||'—'}</div></div>
            <div class="meta-field"><label>Model</label><div class="val">${record.model||'—'}</div></div>
            <div class="meta-field"><label>Condition</label><div class="val">${record.condition||'—'}</div></div>
            <div class="meta-field"><label>Est. Value</label><div class="val green">${record.value?'$'+parseFloat(record.value).toLocaleString():'—'}</div></div>
          </div>
          ${record.notes ? `<button class="toggle-notes" onclick="toggleNotes(this)">▶ Show Notes / Provenance</button><div class="result-notes">${record.notes}</div>` : ''}
          <div class="result-qr" id="result-qr"></div>
        </div>
      </div>
      <div class="action-row">
        <button class="action-btn primary" onclick="openInSuperTool('${record.id}')">
          <span class="icon">⚡</span>Super Tool
        </button>
        <button class="action-btn" onclick="shareRecord('${addr}','${(record.friendlyName||record.itemName||'').replace(/'/g,"\\'")}')">
          <span class="icon">📤</span>Share
        </button>
        <button class="action-btn" onclick="editRecord('${record.id}')">
          <span class="icon">✏️</span>Edit
        </button>
        <button class="action-btn" onclick="deleteRecord('${record.id}')">
          <span class="icon">🗑</span>Delete
        </button>
      </div>
    `;
    // Generate QR
    const qrEl = document.getElementById('result-qr');
    new QRCode(qrEl, {
      text: `HL:${addr}:${record.itemName||''}`,
      width: 120, height: 120,
      colorDark: '#000', colorLight: '#fff',
      correctLevel: QRCode.CorrectLevel.M
    });

  } else if (partials.length) {
    // PARTIAL MATCHES
    el.innerHTML = `
      <div style="background:var(--surface);border:1px solid var(--border);padding:14px 16px;margin-bottom:12px">
        <div style="font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:2px;margin-bottom:10px">PARTIAL MATCHES FOR ${addr}</div>
        ${partials.map(r => `
          <div style="padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="searchAddr('${r.address}')">
            <div style="font-family:var(--mono);font-size:16px;color:var(--accent3);letter-spacing:2px">${r.address}</div>
            <div style="font-size:13px;color:var(--muted)">${r.friendlyName||r.itemName||'—'}</div>
          </div>`).join('')}
      </div>
      <div class="not-found">
        <div class="big">📭</div>
        <h3>No exact match</h3>
        <p>No record found for <strong style="color:var(--accent3)">${addr}</strong> exactly,<br>but ${partials.length} record${partials.length>1?'s':''} found in this zone.</p>
      </div>
      <button class="add-quick-btn" onclick="showQuickAdd('${addr}')">+ Create Record for ${addr}</button>
    `;
  } else {
    // NOT FOUND
    el.innerHTML = `
      <div class="not-found">
        <div class="big">📭</div>
        <h3>Not Found</h3>
        <p>No record found for<br><strong style="color:var(--accent3);font-family:var(--mono);font-size:20px;letter-spacing:3px">${addr}</strong><br><br>This address hasn't been recorded yet.</p>
        <button class="add-quick-btn" onclick="showQuickAdd('${addr}')">+ Create Record for ${addr}</button>
      </div>
    `;
  }
}

function toggleNotes(btn) {
  const notes = btn.nextElementSibling;
  const open = notes.classList.toggle('show');
  btn.textContent = open ? '▼ Hide Notes / Provenance' : '▶ Show Notes / Provenance';
}

function showQuickAdd(addr) {
  const el = document.getElementById('result-content');
  const parts = addr.split('-');
  el.innerHTML += `
    <div class="quick-add-form" id="quick-add">
      <h3>+ New Record</h3>
      <div style="background:var(--bg);border:1px solid var(--accent);padding:10px;font-family:var(--mono);font-size:18px;color:var(--accent);text-align:center;letter-spacing:3px;margin-bottom:14px">${addr}</div>
      <div class="qf-field"><label>Item Name (HL format)</label><input type="text" id="qa-item" placeholder="TOOL-DRILL-CORDLESS-18V" oninput="this.value=this.value.toUpperCase()" autocorrect="off"></div>
      <div class="qf-field"><label>Human Name</label><input type="text" id="qa-friendly" placeholder="Workshop South Drill"></div>
      <div class="qf-field"><label>Category</label>
        <select id="qa-cat">
          <option value="OTHER">Other</option>
          <option value="TOOL">Tool</option><option value="FASTENER">Fastener</option>
          <option value="APPLIANCE">Appliance</option><option value="CONTAINER">Container</option>
          <option value="ZONE">Zone</option><option value="HEIRLOOM">Heirloom</option>
          <option value="ELECTRICAL">Electrical</option><option value="SUPPLY">Supply</option>
        </select>
      </div>
      <div class="qf-field"><label>Make</label><input type="text" id="qa-make" placeholder="Milwaukee, Ford…"></div>
      <div class="qf-field"><label>Condition</label>
        <select id="qa-cond">
          <option value="">—</option><option>New</option><option>Excellent</option>
          <option>Good</option><option>Fair</option><option>Restored</option><option>For Parts</option>
        </select>
      </div>
      <div class="qf-field"><label>Est. Value ($)</label><input type="text" id="qa-value" placeholder="0.00" inputmode="decimal"></div>
      <div class="qf-field"><label>Notes</label><textarea id="qa-notes" placeholder="Story, history, where it came from…"></textarea></div>
      <button class="save-quick-btn" onclick="saveQuickRecord('${addr}')">💾 Save to Vault</button>
    </div>
  `;
  document.getElementById('quick-add').scrollIntoView({behavior:'smooth'});
}

function saveQuickRecord(addr) {
  const item = document.getElementById('qa-item').value.trim();
  if (!item) { showToast('Item name is required'); return; }

  const rec = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    address: addr,
    itemName: item,
    friendlyName: document.getElementById('qa-friendly').value,
    category: document.getElementById('qa-cat').value || 'OTHER',
    make: document.getElementById('qa-make').value,
    model: '',
    condition: document.getElementById('qa-cond').value,
    value: document.getElementById('qa-value').value,
    haType: '',
    notes: document.getElementById('qa-notes').value,
    created: Date.now(),
    updated: Date.now()
  };

  records = loadVault();
  records.unshift(rec);
  saveVault(records);
  showToast('Record saved to Vault ✓');
  searchAddr(addr);
}

// ══════════════════════════════════════
// RECORD ACTIONS
// ══════════════════════════════════════
function openInSuperTool(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  const params = new URLSearchParams({
    addr: r.address||'', item: r.itemName||'', friendly: r.friendlyName||'',
    make: r.make||'', model: r.model||'', condition: r.condition||'',
    value: r.value||'', notes: r.notes||'', hatype: r.haType||'', category: r.category||''
  });
  window.open('hl-super-tool.html?' + params.toString(), '_blank');
  showToast('Opening Super Tool…');
}

function shareRecord(addr, name) {
  const text = `HL Address: ${addr}\n${name}\nLooked up via HL Scanner`;
  if (navigator.share) {
    navigator.share({ title: `HL: ${addr}`, text }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
  }
}

function editRecord(id) {
  showToast('Open the full Vault to edit records');
}

function deleteRecord(id) {
  if (!confirm('Delete this record?')) return;
  records = records.filter(r => r.id !== id);
  saveVault(records);
  showToast('Deleted');
  showScreen('search');
}

// ══════════════════════════════════════
// ALL RECORDS LIST
// ══════════════════════════════════════
function renderAllList() {
  records = loadVault();
  const q = (document.getElementById('all-search').value || '').toLowerCase();
  const list = document.getElementById('all-list');
  const empty = document.getElementById('all-empty');

  const filtered = records.filter(r => {
    if (!q) return true;
    return [r.address,r.itemName,r.friendlyName,r.make].join(' ').toLowerCase().includes(q);
  }).sort((a,b)=>(a.address||'').localeCompare(b.address||''));

  if (!filtered.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  list.innerHTML = filtered.map(r => `
    <div class="list-item" onclick="searchAddr('${r.address}')">
      <div class="list-addr">${r.address||'—'}</div>
      <div class="list-name">
        <div class="list-name-main">${r.friendlyName||r.itemName||'—'}</div>
        <div class="list-name-sub">${r.itemName||''}</div>
      </div>
      <div class="list-arrow">›</div>
    </div>
  `).join('');
}

// ══════════════════════════════════════
// QUICK BUILDER
// ══════════════════════════════════════
function buildQuickAddr() {
  const parts = ['q-struct','q-zone','q-sec','q-shelf'].map(id => document.getElementById(id).value).filter(Boolean);
  document.getElementById('quick-addr-preview').textContent = parts.join('-') || '—';
}

function useQuickAddr() {
  const addr = document.getElementById('quick-addr-preview').textContent;
  if (addr === '—') { showToast('Enter at least a structure and zone'); return; }
  document.getElementById('search-input').value = addr;
  searchAddr(addr);
}

// ══════════════════════════════════════
// VOICE INPUT
// ══════════════════════════════════════
let recognition = null;

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('Voice not supported on this browser'); return; }

  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = e => {
    let raw = e.results[0][0].transcript.toUpperCase();
    // Clean up common speech artifacts
    raw = raw.replace(/\s+/g, '-').replace(/[^A-Z0-9\-]/g, '');
    document.getElementById('search-input').value = raw;
    stopVoice();
    setTimeout(() => searchAddr(raw), 300);
  };

  recognition.onerror = () => { stopVoice(); showToast('Voice error — try typing'); };
  recognition.onend = () => stopVoice();

  recognition.start();
  document.getElementById('listen-overlay').classList.add('open');
  document.getElementById('mic-btn').classList.add('listening');
}

function stopVoice() {
  if (recognition) { try { recognition.stop(); } catch {} recognition = null; }
  document.getElementById('listen-overlay').classList.remove('open');
  document.getElementById('mic-btn').classList.remove('listening');
}

// ══════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════
let prevScreen = 'search';

function showScreen(name) {
  prevScreen = document.querySelector('.screen.active')?.id?.replace('screen-','') || 'search';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('nav-' + (name === 'result' ? 'search' : name))?.classList.add('active');
  document.querySelector('.scroll-area').scrollTop = 0;
  if (name === 'all') renderAllList();
  updateHeader();
}

function goBack() { showScreen('search'); }

function openVault() { window.open('hl-vault.html', '_blank'); }

// ══════════════════════════════════════
// TOAST
// ══════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
renderRecent();
updateHeader();
</script>
