<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIL Museum — Wunderkammer & History Wall</title>

<script>
const _noop = () => {};
window.doSignIn=_noop;window.cancelSignIn=_noop;window.signOutUser=_noop;
window.setMode=_noop;window.filterGrid=_noop;window.react=_noop;
window.openDetail=_noop;window.closeDetail=_noop;window.openForm=_noop;
window.closeForm=_noop;window.saveRecord=_noop;window.removeItem=_noop;
window.openCollectionModal=_noop;window.closeCollectionModal=_noop;window.saveCollection=_noop;
</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  getDocs, getDoc, query, orderBy, serverTimestamp, where, increment }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ── CONFIG ───────────────────────────────────────────────────────────────────
// Get appId from Firebase console → Project Settings → Your apps → App ID
const firebaseConfig = {
  apiKey:            "AIzaSyARjQ3kD8iz9rD-2Fl1zNASnlVDmvDeVb4",
  authDomain:        "project-97444efa-3b6f-493b-b96.firebaseapp.com",
  projectId:         "project-97444efa-3b6f-493b-b96",
  storageBucket:     "project-97444efa-3b6f-493b-b96.firebasestorage.app",
  messagingSenderId: "937314472168",
  appId:             "1:937314472168:web:5ad7b916ac01a9e649b95d"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// ── STATE ────────────────────────────────────────────────────────────────────
let currentUser     = null;
let activeMode      = 'wunderkammer';
let items           = [];
let collections     = [];
let editingId       = null;
let editingIsHWDoc  = false;
let pendingAction   = null;   // fn to run after sign-in completes

// ── AUTH — observe, don't gate ───────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  currentUser = user;
  renderUserChip();
  // If we were waiting on sign-in to do something, do it now
  if (pendingAction) {
    const fn = pendingAction;
    pendingAction = null;
    await fn();
  }
});

// requireAuth: returns true if signed in; otherwise opens mini sign-in modal
// and queues the action to retry after login
function requireAuth(actionFn) {
  if (currentUser) return true;
  pendingAction = actionFn;
  document.getElementById('signin-modal').style.display = 'flex';
  return false;
}

window.doSignIn = async () => {
  try {
    const provider = new GoogleAuthProvider();
    await signInWithPopup(auth, provider);
    document.getElementById('signin-modal').style.display = 'none';
    // pendingAction fires via onAuthStateChanged
  } catch (e) { showToast('Sign-in failed: ' + e.message, 'error'); }
};

window.cancelSignIn = () => {
  pendingAction = null;
  document.getElementById('signin-modal').style.display = 'none';
};

window.signOutUser = async () => {
  await signOut(auth);
  renderUserChip();
};

function renderUserChip() {
  const chip = document.getElementById('user-chip');
  if (currentUser) {
    chip.innerHTML = `
      <img src="${currentUser.photoURL || ''}" alt="">
      <span>${currentUser.displayName || currentUser.email}</span>
      <button class="btn-sign-out" onclick="signOutUser()">SIGN OUT</button>`;
  } else {
    chip.innerHTML = `
      <button class="btn-signin-top" onclick="requireAuth(()=>{})">SIGN IN</button>`;
  }
}

// ── LOAD ─────────────────────────────────────────────────────────────────────
async function loadData() {
  showLoading(true);
  await loadCollections();
  await loadItems();
  renderSidebar();
  renderGrid();
  showLoading(false);
}

async function loadCollections() {
  collections = [];
  try {
    // Collections are per-user; for public view we won't show sidebar collections
    if (!currentUser) return;
    const snap = await getDocs(
      query(collection(db, 'users', currentUser.uid, 'collections'), orderBy('display_order'))
    );
    snap.forEach(d => collections.push({ id: d.id, ...d.data() }));
  } catch(e) {}
  renderCollectionSelect();
}

async function loadItems() {
  items = [];
  try {
    if (activeMode === 'wunderkammer') {
      if (!currentUser) {
        // Public: load all public wunderkammer items across users
        // (Requires a top-level denormalized collection or query on public flag)
        // For now: load from currentUser only; expand to global with a top-level
        // 'public_items' fanout when backend is ready.
        // Placeholder: show empty with a note.
        return;
      }
      const snap = await getDocs(
        query(collection(db, 'users', currentUser.uid, 'item_records'),
          orderBy('updated_at', 'desc'))
      );
      snap.forEach(d => {
        const data = { id: d.id, ...d.data() };
        if (data.display?.wunderkammer) items.push(data);
      });
    } else {
      // History Wall is a global public collection — always readable
      const snap = await getDocs(
        query(collection(db, 'history_wall'), orderBy('created_at', 'desc'))
      );
      snap.forEach(d => items.push({ id: d.id, _hwDoc: true, ...d.data() }));
    }
  } catch(e) { console.error('loadItems:', e); }
}

// ── MODE SWITCH ───────────────────────────────────────────────────────────────
window.setMode = async mode => {
  activeMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
  document.getElementById('panel-wk').style.display = mode === 'wunderkammer' ? 'block' : 'none';
  document.getElementById('panel-hw').style.display = mode === 'history_wall'  ? 'block' : 'none';
  document.getElementById('grid-heading').textContent =
    mode === 'wunderkammer' ? 'Wunderkammer' : 'History Wall';
  const saveBtn = document.getElementById('save-btn');
  if (saveBtn) saveBtn.className = 'btn-primary' + (mode === 'history_wall' ? ' hw' : '');
  closeForm();
  await loadData();
};

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById('collection-list');
  if (activeMode === 'history_wall') {
    el.innerHTML = `
      <div class="sidebar-section-label">FILTER</div>
      <div class="sidebar-item active" onclick="filterGrid(null, this)">All Records
        <span class="pill">${items.length}</span></div>
      <div class="sidebar-item" onclick="filterGrid('public', this)">Public Only
        <span class="pill">${items.filter(i=>i.public).length}</span></div>
      <div class="sidebar-item" onclick="filterGrid('mine', this)">My Records
        <span class="pill">${items.filter(i=>i.owner_uid===currentUser?.uid).length}</span></div>
      <div class="sidebar-divider"></div>
      <button class="sidebar-add-btn" onclick="openForm()">+ Add Heritage Record</button>`;
    return;
  }
  // Wunderkammer
  let html = `
    <div class="sidebar-section-label">COLLECTIONS</div>
    <div class="sidebar-item active" onclick="filterGrid(null, this)">All Items
      <span class="pill">${items.length}</span></div>`;
  collections.forEach(c => {
    const count = items.filter(i => i.wunderkammer?.collection_id === c.id).length;
    html += `<div class="sidebar-item" onclick="filterGrid('coll:${c.id}', this)">
      ${c.name}<span class="pill">${count}</span></div>`;
  });
  html += `
    <div class="sidebar-divider"></div>
    <button class="sidebar-add-btn" onclick="openCollectionModal()">+ New Collection</button>
    <button class="sidebar-add-btn" onclick="openForm()">+ Add Item</button>`;
  el.innerHTML = html;
}

window.filterGrid = (filter, el) => {
  document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
  el?.classList.add('active');
  let filtered = items;
  if (filter === 'public')     filtered = items.filter(i => i.public);
  else if (filter === 'mine')  filtered = items.filter(i => i.owner_uid === currentUser?.uid);
  else if (filter?.startsWith('coll:')) {
    const id = filter.slice(5);
    filtered = items.filter(i => i.wunderkammer?.collection_id === id);
  }
  renderGrid(filtered);
};

// ── GRID ─────────────────────────────────────────────────────────────────────
function renderGrid(filtered = items) {
  const grid = document.getElementById('item-grid');
  document.getElementById('item-count-label').textContent =
    `${filtered.length} record${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    const isLoggedIn = !!currentUser;
    const wkNote = isLoggedIn
      ? 'Add items to your Vault and flag them for the Wunderkammer, or create a record below.'
      : 'Sign in to add your collection to the Wunderkammer.';
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">${activeMode === 'wunderkammer' ? '🏛️' : '📜'}</div>
      <div class="empty-title">Nothing here yet</div>
      <div class="empty-sub">${activeMode === 'wunderkammer' ? wkNote : 'Be the first to add a heritage record to the History Wall.'}</div>
      <button class="btn-primary" onclick="openForm()">
        + ${activeMode === 'wunderkammer' ? 'Add Item' : 'Add Heritage Record'}</button>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => renderCard(item)).join('');
}

function renderCard(item) {
  const isHW     = item._hwDoc || activeMode === 'history_wall';
  const isMine   = currentUser && item.owner_uid === currentUser.uid;
  const photo    = item.hero_photo || '';
  const name     = item.display_name || item.name || 'Untitled';
  const sub      = isHW
    ? [item.person, item.dates].filter(Boolean).join(' · ')
    : [item.manufacturer, item.year_made].filter(Boolean).join(' · ');
  const reaction = isHW
    ? `<button class="react-btn hw" onclick="event.stopPropagation();react('${item.id}','heart',${item._hwDoc||false})">♡ ${item.heart_count||0}</button>`
    : `<button class="react-btn wk" onclick="event.stopPropagation();react('${item.id}','star',${item._hwDoc||false})">★ ${item.wunderkammer?.star_count||0}</button>`;
  const crown = item.wunderkammer?.is_crown_piece ? '<span class="crown-badge">👑</span>' : '';
  const statusBadge = (item.status && item.status !== 'active')
    ? `<span class="status-badge ${item.status}">${item.status.replace('_',' ')}</span>` : '';
  const editBtns = isMine ? `
    <button class="icon-btn" title="Edit" onclick="event.stopPropagation();openForm('${item.id}',${!!item._hwDoc})">✎</button>
    <button class="icon-btn danger" title="Remove" onclick="event.stopPropagation();removeItem('${item.id}',${!!item._hwDoc})">✕</button>` : '';

  return `<div class="item-card" onclick="openDetail('${item.id}',${!!item._hwDoc})">
    <div class="card-photo ${photo ? '' : 'no-photo'}">
      ${photo ? `<img src="${photo}" alt="${name}" loading="lazy">` : '<div class="photo-placeholder">📷</div>'}
      ${crown}${statusBadge}
    </div>
    <div class="card-body">
      <div class="card-name">${name}</div>
      ${sub ? `<div class="card-sub">${sub}</div>` : ''}
      <div class="card-footer">
        ${reaction}
        <div class="card-actions">${editBtns}</div>
      </div>
    </div>
  </div>`;
}

// ── REACTIONS (star / heart) — requires auth ──────────────────────────────────
window.react = (itemId, type, isHWDoc) => {
  requireAuth(async () => {
    try {
      if (isHWDoc || type === 'heart') {
        await updateDoc(doc(db, 'history_wall', itemId),
          { heart_count: increment(1), updated_at: serverTimestamp() });
      } else {
        // Update star on item_record wunderkammer block
        await updateDoc(doc(db, 'users', currentUser.uid, 'item_records', itemId),
          { 'wunderkammer.star_count': increment(1), updated_at: serverTimestamp() });
      }
      await loadData();
      showToast(type === 'heart' ? '♡ +1' : '★ +1');
    } catch(e) { showToast('Error: ' + e.message, 'error'); }
  });
};

// ── DETAIL VIEW (read-only overlay) ──────────────────────────────────────────
window.openDetail = async (itemId, isHWDoc) => {
  let data;
  try {
    if (isHWDoc) {
      const snap = await getDoc(doc(db, 'history_wall', itemId));
      data = { id: snap.id, _hwDoc: true, ...snap.data() };
    } else {
      // Find from loaded items (avoid extra read if possible)
      data = items.find(i => i.id === itemId);
    }
  } catch(e) { return; }
  if (!data) return;

  const isMine = currentUser && data.owner_uid === currentUser.uid;
  const isHW   = data._hwDoc || activeMode === 'history_wall';

  const overlay = document.getElementById('detail-overlay');
  overlay.style.display = 'flex';

  const body = isHW ? `
    ${data.person ? `<div class="detail-person">${data.person}${data.relationship ? ` <span class="detail-rel">· ${data.relationship}</span>` : ''}</div>` : ''}
    ${data.dates  ? `<div class="detail-meta">${data.dates}${data.location ? ` · ${data.location}` : ''}</div>` : ''}
    ${data.narrative   ? `<div class="detail-section-label">THE STORY</div><div class="detail-text">${data.narrative}</div>` : ''}
    ${data.significance ? `<div class="detail-section-label">SIGNIFICANCE</div><div class="detail-text">${data.significance}</div>` : ''}
    ${data.transfer_story ? `<div class="detail-section-label">HOW IT PASSED HANDS</div><div class="detail-text">${data.transfer_story}</div>` : ''}
    <div class="detail-react">
      <button class="react-btn hw large" onclick="react('${data.id}','heart',${!!data._hwDoc})">♡ ${data.heart_count||0} hearts</button>
    </div>`
  : `
    ${data.manufacturer || data.year_made ? `<div class="detail-meta">${[data.manufacturer, data.year_made].filter(Boolean).join(' · ')}</div>` : ''}
    ${data.description  ? `<div class="detail-text" style="margin-top:0.75rem">${data.description}</div>` : ''}
    ${data.narrative    ? `<div class="detail-section-label">STORY</div><div class="detail-text">${data.narrative}</div>` : ''}
    ${data.provenance   ? `<div class="detail-section-label">PROVENANCE</div><div class="detail-text">${data.provenance}</div>` : ''}
    ${data.condition    ? `<div class="detail-section-label">CONDITION</div><div class="detail-text">${data.condition}${data.condition_notes ? ' — ' + data.condition_notes : ''}</div>` : ''}
    <div class="detail-react">
      <button class="react-btn wk large" onclick="react('${data.id}','star',false)">★ ${data.wunderkammer?.star_count||0} stars</button>
    </div>`;

  document.getElementById('detail-inner').innerHTML = `
    ${data.hero_photo ? `<div class="detail-photo"><img src="${data.hero_photo}" alt="${data.display_name||''}"></div>` : ''}
    <div class="detail-content">
      <div class="detail-name">${data.display_name || data.name || 'Untitled'}</div>
      ${body}
      ${isMine ? `<div class="detail-owner-actions">
        <button class="btn-secondary" onclick="closeDetail();openForm('${data.id}',${!!data._hwDoc})">Edit Record</button>
        <button class="btn-secondary danger" onclick="closeDetail();removeItem('${data.id}',${!!data._hwDoc})">Remove from Wall</button>
      </div>` : ''}
    </div>`;
};

window.closeDetail = () => {
  document.getElementById('detail-overlay').style.display = 'none';
};

// ── FORM (write — requires auth) ──────────────────────────────────────────────
window.openForm = (itemId = null, isHWDoc = false) => {
  requireAuth(async () => {
    editingId      = itemId;
    editingIsHWDoc = isHWDoc;
    document.getElementById('form-panel').classList.add('open');
    document.getElementById('form-title').textContent =
      itemId ? 'Edit Record' : (activeMode === 'wunderkammer' ? 'New Item' : 'New Heritage Record');

    if (itemId) {
      try {
        if (isHWDoc) {
          const snap = await getDoc(doc(db, 'history_wall', itemId));
          if (snap.exists()) populateHWForm(snap.data());
        } else {
          const snap = await getDoc(doc(db, 'users', currentUser.uid, 'item_records', itemId));
          if (snap.exists()) {
            activeMode === 'wunderkammer' ? populateWKForm(snap.data()) : populateHWForm(snap.data());
          }
        }
      } catch(e) {}
    }
  });
};

window.closeForm = () => {
  editingId = null;
  document.getElementById('form-panel').classList.remove('open');
  document.getElementById('wk-form')?.reset();
  document.getElementById('hw-form')?.reset();
};

function populateWKForm(d) {
  sv('wk-display-name', d.display_name); sv('wk-name', d.name);
  sv('wk-manufacturer', d.manufacturer); sv('wk-year', d.year_made);
  sv('wk-description', d.description);   sv('wk-narrative', d.narrative);
  sv('wk-provenance', d.provenance);     sv('wk-condition', d.condition);
  sv('wk-category', d.category);         sv('wk-tags', (d.tags||[]).join(', '));
  sv('wk-status', d.status||'active');   sv('wk-hero-photo', d.hero_photo);
  sv('wk-collection-id', d.wunderkammer?.collection_id||'');
  sc('wk-crown', d.wunderkammer?.is_crown_piece);
  sc('wk-public', d.public);
}

function populateHWForm(d) {
  sv('hw-display-name', d.display_name); sv('hw-person', d.person);
  sv('hw-relationship', d.relationship); sv('hw-dates', d.dates);
  sv('hw-location', d.location);         sv('hw-narrative', d.narrative);
  sv('hw-significance', d.significance); sv('hw-transfer-story', d.transfer_story);
  sv('hw-hero-photo', d.hero_photo);     sc('hw-public', d.public);
}

function sv(id, v) { const e=document.getElementById(id); if(e&&v!=null) e.value=v; }
function sc(id, v) { const e=document.getElementById(id); if(e) e.checked=!!v; }
function gv(id)    { return document.getElementById(id)?.value?.trim()||''; }

window.saveRecord = async () => {
  if (!currentUser) { requireAuth(window.saveRecord); return; }
  try {
    activeMode === 'wunderkammer' ? await saveWK() : await saveHW();
    showToast('Saved ✓');
    closeForm();
    await loadData();
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
};

async function saveWK() {
  const data = {
    owner_uid: currentUser.uid,
    display_name: gv('wk-display-name'),
    name:         gv('wk-name') || gv('wk-display-name'),
    manufacturer: gv('wk-manufacturer'),    year_made:  gv('wk-year'),
    description:  gv('wk-description'),     narrative:  gv('wk-narrative'),
    provenance:   gv('wk-provenance'),      condition:  gv('wk-condition'),
    category:     gv('wk-category'),
    tags:         gv('wk-tags').split(',').map(t=>t.trim()).filter(Boolean),
    status:       gv('wk-status') || 'active',
    hero_photo:   gv('wk-hero-photo'),
    public:       document.getElementById('wk-public')?.checked||false,
    display: { vault:true, wunderkammer:true, history_wall:false,
      brag_shelf:false, exchange:false, sign_studio:false, family_ledger:false },
    wunderkammer: {
      collection_id:  gv('wk-collection-id') || null,
      is_crown_piece: document.getElementById('wk-crown')?.checked||false,
      display_order:  editingId ? undefined : items.length,
      star_count:     editingId ? undefined : 0,
    },
    updated_at: serverTimestamp(),
  };
  // Remove undefined fields
  Object.keys(data.wunderkammer).forEach(k => data.wunderkammer[k]===undefined && delete data.wunderkammer[k]);

  if (editingId) {
    await updateDoc(doc(db,'users',currentUser.uid,'item_records',editingId), data);
  } else {
    data.created_at = serverTimestamp(); data.source = 'manual';
    await addDoc(collection(db,'users',currentUser.uid,'item_records'), data);
  }
}

async function saveHW() {
  const data = {
    owner_uid:      currentUser.uid,
    display_name:   gv('hw-display-name'),
    person:         gv('hw-person'),       relationship:  gv('hw-relationship'),
    dates:          gv('hw-dates'),        location:      gv('hw-location'),
    narrative:      gv('hw-narrative'),    significance:  gv('hw-significance'),
    transfer_story: gv('hw-transfer-story'),
    hero_photo:     gv('hw-hero-photo'),
    public:         document.getElementById('hw-public')?.checked||false,
    updated_at:     serverTimestamp(),
  };

  if (editingId && editingIsHWDoc) {
    await updateDoc(doc(db,'history_wall',editingId), data);
  } else if (editingId) {
    // item_record: set display flag + write heritage block
    await updateDoc(doc(db,'users',currentUser.uid,'item_records',editingId), {
      'display.history_wall': true,
      heritage: { person:data.person, relationship:data.relationship,
        date_range:data.dates, location:data.location,
        significance:data.significance, transfer_story:data.transfer_story,
        heart_count:0 },
      updated_at: serverTimestamp()
    });
  } else {
    data.heart_count = 0; data.featured = false;
    data.created_at  = serverTimestamp();
    await addDoc(collection(db,'history_wall'), data);
  }
}

window.removeItem = (itemId, isHWDoc) => {
  requireAuth(async () => {
    if (!confirm('Remove this record from the wall? Item stays in your Vault.')) return;
    try {
      if (isHWDoc) {
        await deleteDoc(doc(db,'history_wall',itemId));
      } else if (activeMode === 'wunderkammer') {
        await updateDoc(doc(db,'users',currentUser.uid,'item_records',itemId),
          {'display.wunderkammer':false, updated_at:serverTimestamp()});
      } else {
        await updateDoc(doc(db,'users',currentUser.uid,'item_records',itemId),
          {'display.history_wall':false, updated_at:serverTimestamp()});
      }
      showToast('Removed');
      await loadData();
    } catch(e) { showToast('Error: '+e.message,'error'); }
  });
};

// ── COLLECTION MODAL ──────────────────────────────────────────────────────────
window.openCollectionModal = () => {
  requireAuth(() => {
    document.getElementById('collection-modal').style.display = 'flex';
  });
};
window.closeCollectionModal = () => {
  document.getElementById('collection-modal').style.display='none';
  document.getElementById('coll-form')?.reset();
};
window.saveCollection = async () => {
  if (!currentUser) return;
  const name = document.getElementById('coll-name')?.value?.trim();
  if (!name) { showToast('Name required','error'); return; }
  try {
    await addDoc(collection(db,'users',currentUser.uid,'collections'), {
      owner_uid: currentUser.uid,
      name, slug: name.toLowerCase().replace(/\s+/g,'-'),
      subtitle:    document.getElementById('coll-subtitle')?.value?.trim()||'',
      narrative:   document.getElementById('coll-narrative')?.value?.trim()||'',
      depth_tier:  document.getElementById('coll-tier')?.value||'snapshot',
      public:      document.getElementById('coll-public')?.checked||false,
      display_order: collections.length,
      item_count_total:0, item_count_active:0, star_count:0,
      created_at: serverTimestamp(), updated_at: serverTimestamp(),
    });
    showToast('Collection created');
    await loadCollections(); renderSidebar();
    closeCollectionModal();
  } catch(e) { showToast('Error: '+e.message,'error'); }
};

function renderCollectionSelect() {
  const sel = document.getElementById('wk-collection-id');
  if (!sel) return;
  sel.innerHTML = '<option value="">— No collection —</option>' +
    collections.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function showLoading(on) {
  document.getElementById('loading-bar').style.width = on ? '60%' : '100%';
  setTimeout(()=>{ document.getElementById('loading-bar').style.width='0'; }, on ? 0 : 300);
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(()=>{ t.className='toast'; }, 2800);
}

        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 01-7.18-2.54H1.83v2.07A8 8 0 008.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 010-3.04V5.41H1.83a8 8 0 000 7.18l2.67-2.07z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 001.83 5.4L4.5 7.49a4.77 4.77 0 014.48-3.31z"/>
      </svg>
      Sign in with Google
    </button>
    <button class="btn-cancel" onclick="cancelSignIn()">Cancel — keep browsing</button>
  </div>
</div>

<!-- COLLECTION MODAL -->
<div id="collection-modal">
  <div class="modal-box">
    <div class="modal-title">New Collection</div>
    <form id="coll-form" onsubmit="return false">
      <div class="field"><label>Collection Name *</label><input id="coll-name" type="text" placeholder="Dead Man's Party"></div>
      <div class="field"><label>Subtitle</label><input id="coll-subtitle" type="text" placeholder="The Oingo Boingo · Danny Elfman Collection"></div>
      <div class="field"><label>Narrative</label><textarea id="coll-narrative" rows="3" placeholder="Who assembled it, when it started, what holds it together"></textarea></div>
      <div class="field"><label>Depth Tier</label><select id="coll-tier">
        <option value="snapshot">Snapshot — one photo + one sentence</option>
        <option value="documented">Documented — items being added over time</option>
        <option value="full_record">Full Record — every item individually documented</option>
      </select></div>
      <div class="checkbox-field" style="margin-top:.5rem">
        <input type="checkbox" id="coll-public"><label for="coll-public">Public museum</label>
      </div>
    </form>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeCollectionModal()">Cancel</button>
      <button class="btn-primary" onclick="saveCollection()">Create Collection</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
