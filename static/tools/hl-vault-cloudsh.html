<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HL Vault — HIL System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://hlsystem.org/tools/hil-shell.js"></script>

  <style>
    /* ── VAULT-SPECIFIC STYLES ── */

    /* Tab bar */
    .vault-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--hil-border);
      margin-bottom: 20px;
    }
    .vault-tab {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      padding: 10px 18px;
      color: var(--hil-text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.1s, border-color 0.1s;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      user-select: none;
    }
    .vault-tab:hover { color: var(--hil-text-dim); }
    .vault-tab.active {
      color: var(--hil-green);
      border-bottom-color: var(--hil-green);
    }

    /* Toolbar */
    .vault-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .vault-toolbar .hil-input {
      flex: 1;
      min-width: 200px;
      max-width: 320px;
    }
    .vault-toolbar-right {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    /* Filter chips */
    .filter-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-chip {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--hil-border);
      color: var(--hil-text-muted);
      cursor: pointer;
      background: none;
      transition: all 0.1s;
    }
    .filter-chip:hover { border-color: var(--hil-text-muted); color: var(--hil-text-dim); }
    .filter-chip.active {
      background: var(--hil-green-glow);
      border-color: var(--hil-green-dim);
      color: var(--hil-green);
    }

    /* Item list */
    .item-list { display: flex; flex-direction: column; gap: 6px; }

    .item-row {
      display: grid;
      grid-template-columns: 48px 1fr auto auto;
      gap: 12px;
      align-items: center;
      background: var(--hil-surface-1);
      border: 1px solid var(--hil-border);
      border-radius: var(--hil-radius-lg);
      padding: 10px 14px;
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s;
    }
    .item-row:hover {
      border-color: var(--hil-border);
      background: var(--hil-surface-2);
    }

    .item-thumb {
      width: 48px;
      height: 48px;
      border-radius: var(--hil-radius);
      background: var(--hil-surface-3);
      border: 1px solid var(--hil-border);
      object-fit: cover;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--hil-text-muted);
      font-size: 20px;
    }
    .item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--hil-radius);
    }

    .item-info { min-width: 0; }
    .item-name {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 14px;
      color: var(--hil-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .item-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .item-address {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--hil-green);
      letter-spacing: 0.06em;
    }
    .item-category {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--hil-text-muted);
      letter-spacing: 0.06em;
    }

    .item-status-col { text-align: right; }
    .item-actions { display: flex; gap: 6px; }

    .icon-btn {
      background: none;
      border: none;
      color: var(--hil-text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 6px;
      border-radius: var(--hil-radius);
      transition: color 0.1s, background 0.1s;
    }
    .icon-btn:hover { color: var(--hil-text); background: var(--hil-surface-3); }

    /* Stats bar */
    .vault-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--hil-surface-1);
      border: 1px solid var(--hil-border);
      border-radius: var(--hil-radius-lg);
      padding: 14px 16px;
    }
    .stat-val {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--hil-green);
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--hil-text-muted);
    }
    @media (max-width: 600px) { .vault-stats { grid-template-columns: 1fr 1fr; } }

    /* Kit tab */
    .kit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .kit-card {
      background: var(--hil-surface-1);
      border: 1px solid var(--hil-border);
      border-radius: var(--hil-radius-lg);
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.1s;
    }
    .kit-card:hover { border-color: var(--hil-green-dim); }
    .kit-id {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--hil-green);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .kit-name {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 500;
      color: var(--hil-text);
      margin-bottom: 8px;
    }
    .kit-meta {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--hil-text-muted);
      letter-spacing: 0.06em;
    }
    .kit-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    /* Detail modal extras */
    .detail-hero {
      width: 100%;
      height: 200px;
      background: var(--hil-surface-3);
      border-radius: var(--hil-radius);
      margin-bottom: 16px;
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      overflow: hidden;
    }
    .detail-hero img { width: 100%; height: 100%; object-fit: cover; }

    .detail-section { margin-bottom: 18px; }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 6px 0;
      border-bottom: 1px solid var(--hil-border-dim);
      font-size: 13px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-key {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--hil-text-muted);
      flex-shrink: 0;
      padding-right: 16px;
      padding-top: 1px;
    }
    .detail-val { color: var(--hil-text); text-align: right; }

    .display-flags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Add/Edit modal - wider */
    #item-modal .hil-modal { max-width: 680px; }
    #kit-modal .hil-modal { max-width: 560px; }
  </style>
</head>
<body>

<div class="hil-container">
  <!-- Stats Bar -->
  <div class="vault-stats" id="vault-stats">
    <div class="stat-card">
      <div class="stat-val" id="stat-total">—</div>
      <div class="stat-label">TOTAL ITEMS</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-active">—</div>
      <div class="stat-label">ACTIVE</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-kits">—</div>
      <div class="stat-label">KITS</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-value">—</div>
      <div class="stat-label">EST. VALUE</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="vault-tabs">
    <button class="vault-tab active" data-tab="items">ITEMS</button>
    <button class="vault-tab" data-tab="kits">KITS</button>
    <button class="vault-tab" data-tab="vessels">VESSELS</button>
  </div>

  <!-- ITEMS TAB -->
  <div id="tab-items">
    <div class="vault-toolbar">
      <input class="hil-input" type="search" id="search-input" placeholder="Search name, address, category…">
      <div class="filter-chips" id="category-filters">
        <button class="filter-chip active" data-cat="">ALL</button>
        <button class="filter-chip" data-cat="tool">TOOL</button>
        <button class="filter-chip" data-cat="collectible">COLLECTIBLE</button>
        <button class="filter-chip" data-cat="heirloom">HEIRLOOM</button>
        <button class="filter-chip" data-cat="ephemera">EPHEMERA</button>
        <button class="filter-chip" data-cat="other">OTHER</button>
      </div>
      <div class="vault-toolbar-right">
        <button class="hil-btn primary" id="add-item-btn">+ ADD ITEM</button>
      </div>
    </div>

    <div class="item-list" id="item-list">
      <div class="hil-empty">
        <div class="hil-empty-icon">🗄</div>
        Loading inventory…
      </div>
    </div>
  </div>

  <!-- KITS TAB -->
  <div id="tab-kits" style="display:none">
    <div class="vault-toolbar">
      <input class="hil-input" type="search" id="kit-search" placeholder="Search kits…">
      <div class="vault-toolbar-right">
        <button class="hil-btn primary" id="add-kit-btn">+ ADD KIT</button>
      </div>
    </div>
    <div class="kit-grid" id="kit-grid">
      <div class="hil-empty"><div class="hil-empty-icon">🧰</div>No kits yet.</div>
    </div>
  </div>

  <!-- VESSELS TAB -->
  <div id="tab-vessels" style="display:none">
    <div class="vault-toolbar">
      <input class="hil-input" type="search" id="vessel-search" placeholder="Search vessels…">
      <div class="vault-toolbar-right">
        <button class="hil-btn primary" id="add-vessel-btn">+ ADD VESSEL</button>
      </div>
    </div>
    <div class="item-list" id="vessel-list">
      <div class="hil-empty"><div class="hil-empty-icon">📦</div>No vessels yet.</div>
    </div>
  </div>
</div>

<!-- ─── ITEM DETAIL MODAL ─────────────────────────────────────────────────── -->
<div class="hil-modal-overlay" id="detail-modal">
  <div class="hil-modal">
    <div class="hil-modal-header">
      <span id="detail-modal-title">ITEM DETAIL</span>
      <button class="hil-modal-close" data-close="detail-modal">✕</button>
    </div>
    <div class="hil-modal-body" id="detail-modal-body">
      <!-- populated dynamically -->
    </div>
    <div class="hil-modal-footer">
      <button class="hil-btn danger" id="detail-delete-btn">DELETE</button>
      <button class="hil-btn" id="detail-edit-btn">EDIT</button>
      <button class="hil-btn" data-close="detail-modal">CLOSE</button>
    </div>
  </div>
</div>

<!-- ─── ADD / EDIT ITEM MODAL ─────────────────────────────────────────────── -->
<div class="hil-modal-overlay" id="item-modal">
  <div class="hil-modal" style="max-width:680px">
    <div class="hil-modal-header">
      <span id="item-modal-title">ADD ITEM</span>
      <button class="hil-modal-close" data-close="item-modal">✕</button>
    </div>
    <div class="hil-modal-body">
      <input type="hidden" id="edit-item-id">

      <div class="hil-grid-2">
        <div class="hil-field">
          <label class="hil-label">DISPLAY NAME *</label>
          <input class="hil-input" id="f-display-name" placeholder="Champion Hand Crank Grinder">
        </div>
        <div class="hil-field">
          <label class="hil-label">HL ADDRESS</label>
          <input class="hil-input" id="f-hl-address" placeholder="SH-MM-S3-A1">
        </div>
      </div>

      <div class="hil-grid-2">
        <div class="hil-field">
          <label class="hil-label">CATEGORY</label>
          <select class="hil-select" id="f-category">
            <option value="tool">Tool</option>
            <option value="collectible">Collectible</option>
            <option value="heirloom">Heirloom</option>
            <option value="ephemera">Ephemera</option>
            <option value="media">Media</option>
            <option value="artwork">Artwork</option>
            <option value="document">Document</option>
            <option value="specimen">Specimen</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="hil-field">
          <label class="hil-label">STATUS</label>
          <select class="hil-select" id="f-status">
            <option value="active">Active</option>
            <option value="transferred">Transferred</option>
            <option value="donated">Donated</option>
            <option value="passed_on">Passed On</option>
            <option value="lost">Lost</option>
          </select>
        </div>
      </div>

      <div class="hil-grid-3">
        <div class="hil-field">
          <label class="hil-label">MANUFACTURER</label>
          <input class="hil-input" id="f-manufacturer" placeholder="Champion">
        </div>
        <div class="hil-field">
          <label class="hil-label">YEAR MADE</label>
          <input class="hil-input" id="f-year-made" placeholder="c.1920s">
        </div>
        <div class="hil-field">
          <label class="hil-label">CONDITION</label>
          <select class="hil-select" id="f-condition">
            <option value="unknown">Unknown</option>
            <option value="mint">Mint</option>
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="fair">Fair</option>
            <option value="poor">Poor</option>
          </select>
        </div>
      </div>

      <div class="hil-field">
        <label class="hil-label">DESCRIPTION</label>
        <textarea class="hil-textarea" id="f-description" rows="2" placeholder="Short — one or two sentences."></textarea>
      </div>

      <div class="hil-field">
        <label class="hil-label">PROVENANCE</label>
        <textarea class="hil-textarea" id="f-provenance" rows="2" placeholder="Origin, previous owners, how it arrived."></textarea>
      </div>

      <div class="hil-field">
        <label class="hil-label">NARRATIVE</label>
        <textarea class="hil-textarea" id="f-narrative" rows="3" placeholder="The full story. No limit."></textarea>
      </div>

      <!-- Financial -->
      <div class="hil-section-label" style="margin-top:8px">FINANCIAL</div>
      <div class="hil-grid-3">
        <div class="hil-field">
          <label class="hil-label">PURCHASE PRICE ($)</label>
          <input class="hil-input" type="number" id="f-purchase-price" placeholder="0.00">
        </div>
        <div class="hil-field">
          <label class="hil-label">CURRENT VALUE ($)</label>
          <input class="hil-input" type="number" id="f-current-value" placeholder="0.00">
        </div>
        <div class="hil-field">
          <label class="hil-label">PURCHASE SOURCE</label>
          <input class="hil-input" id="f-purchase-source" placeholder="Estate sale">
        </div>
      </div>

      <!-- Kit memberships -->
      <div class="hil-section-label">KIT MEMBERSHIPS</div>
      <div class="hil-field">
        <label class="hil-label">KIT IDs (comma-separated)</label>
        <input class="hil-input" id="f-kit-memberships" placeholder="TK-REPAIR-SCREEN, TK-WORKSHOP-BASIC">
      </div>

      <!-- Display flags -->
      <div class="hil-section-label">DISPLAY FLAGS</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted)">
          <input type="checkbox" id="f-flag-vault" checked> VAULT
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted)">
          <input type="checkbox" id="f-flag-wunderkammer"> MUSEUM
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted)">
          <input type="checkbox" id="f-flag-history-wall"> HISTORY WALL
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted)">
          <input type="checkbox" id="f-flag-exchange"> EXCHANGE
        </label>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--hil-text-muted)">
          <input type="checkbox" id="f-flag-family-ledger"> FAMILY LEDGER
        </label>
      </div>
    </div>
    <div class="hil-modal-footer">
      <button class="hil-btn" data-close="item-modal">CANCEL</button>
      <button class="hil-btn primary" id="save-item-btn">SAVE ITEM</button>
    </div>
  </div>
</div>

<!-- ─── ADD / EDIT KIT MODAL ──────────────────────────────────────────────── -->
<div class="hil-modal-overlay" id="kit-modal">
  <div class="hil-modal">
    <div class="hil-modal-header">
      <span id="kit-modal-title">ADD KIT</span>
      <button class="hil-modal-close" data-close="kit-modal">✕</button>
    </div>
    <div class="hil-modal-body">
      <input type="hidden" id="edit-kit-id">

      <div class="hil-grid-2">
        <div class="hil-field">
          <label class="hil-label">KIT ID *</label>
          <input class="hil-input" id="k-kit-id" placeholder="TK-REPAIR-SCREEN">
        </div>
        <div class="hil-field">
          <label class="hil-label">PREFIX</label>
          <select class="hil-select" id="k-prefix">
            <option value="TK">TK — Tool Kit</option>
            <option value="SK">SK — Supply Kit</option>
            <option value="MK">MK — Material Kit</option>
            <option value="CK">CK — Care Kit</option>
            <option value="FC">FC — Family Kit</option>
          </select>
        </div>
      </div>

      <div class="hil-field">
        <label class="hil-label">KIT NAME *</label>
        <input class="hil-input" id="k-name" placeholder="Screen Repair Kit">
      </div>

      <div class="hil-grid-2">
        <div class="hil-field">
          <label class="hil-label">DOMAIN</label>
          <select class="hil-select" id="k-domain">
            <option value="domestic_culinary">Domestic / Culinary</option>
            <option value="machining_metalwork">Machining / Metalwork</option>
            <option value="woodcraft_restoration">Woodcraft / Restoration</option>
            <option value="fine_arts_musical">Fine Arts / Musical</option>
            <option value="materia_medica_lab">Materia Medica / Lab</option>
            <option value="outdoor_homestead">Outdoor / Homestead</option>
          </select>
        </div>
        <div class="hil-field">
          <label class="hil-label">TIER</label>
          <select class="hil-select" id="k-tier">
            <option value="1">Tier 1 — Domestic Base</option>
            <option value="2" selected>Tier 2 — Project</option>
            <option value="3">Tier 3 — Capability</option>
          </select>
        </div>
      </div>

      <div class="hil-grid-2">
        <div class="hil-field">
          <label class="hil-label">HL ADDRESS</label>
          <input class="hil-input" id="k-hl-address" placeholder="SH-MM-S3-A1">
        </div>
        <div class="hil-field">
          <label class="hil-label">STATUS</label>
          <select class="hil-select" id="k-status">
            <option value="assembly">Assembly</option>
            <option value="active" selected>Active</option>
            <option value="shared">Shared</option>
            <option value="archived">Archived</option>
          </select>
        </div>
      </div>

      <div class="hil-field">
        <label class="hil-label">CAPABILITIES (one per line)</label>
        <textarea class="hil-textarea" id="k-capabilities" rows="3" placeholder="repair window screen&#10;patch mesh fabric&#10;cut screen material"></textarea>
      </div>
    </div>
    <div class="hil-modal-footer">
      <button class="hil-btn" data-close="kit-modal">CANCEL</button>
      <button class="hil-btn primary" id="save-kit-btn">SAVE KIT</button>
    </div>
  </div>
</div>

<!-- ─── ADD VESSEL MODAL ───────────────────────────────────────────────────── -->
<div class="hil-modal-overlay" id="vessel-modal">
  <div class="hil-modal">
    <div class="hil-modal-header">
      <span>ADD VESSEL</span>
      <button class="hil-modal-close" data-close="vessel-modal">✕</button>
    </div>
    <div class="hil-modal-body">
      <input type="hidden" id="edit-vessel-id">

      <div class="hil-grid-2">
        <div class="hil-field">
          <label class="hil-label">VESSEL ID *</label>
          <input class="hil-input" id="v-vessel-id" placeholder="MS-013">
        </div>
        <div class="hil-field">
          <label class="hil-label">PREFIX</label>
          <select class="hil-select" id="v-prefix">
            <option value="MS">MS — Metal Shop Cart</option>
            <option value="SP">SP — Supply Container</option>
            <option value="BX">BX — Box</option>
            <option value="TB">TB — Tote Bin</option>
            <option value="BG">BG — Bag</option>
          </select>
        </div>
      </div>

      <div class="hil-field">
        <label class="hil-label">VESSEL NAME *</label>
        <input class="hil-input" id="v-name" placeholder="Metal Shop Cart 013">
      </div>

      <div class="hil-grid-2">
        <div class="hil-field">
          <label class="hil-label">CURRENT HL ADDRESS</label>
          <input class="hil-input" id="v-hl-address" placeholder="SH-MM-S1-A0">
        </div>
        <div class="hil-field">
          <label class="hil-label">HOME ADDRESS</label>
          <input class="hil-input" id="v-home-address" placeholder="SH-MM-S1-A0">
        </div>
      </div>

      <div class="hil-grid-2">
        <div class="hil-field">
          <label class="hil-label">FILL LEVEL</label>
          <select class="hil-select" id="v-fill-level">
            <option value="full">Full</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
            <option value="empty">Empty</option>
          </select>
        </div>
        <div class="hil-field">
          <label class="hil-label">ACTIVE KIT ID</label>
          <input class="hil-input" id="v-kit-id" placeholder="TK-REPAIR-SCREEN">
        </div>
      </div>
    </div>
    <div class="hil-modal-footer">
      <button class="hil-btn" data-close="vessel-modal">CANCEL</button>
      <button class="hil-btn primary" id="save-vessel-btn">SAVE VESSEL</button>
    </div>
  </div>
</div>

<script>
// ─── VAULT LOGIC ─────────────────────────────────────────────────────────────

let allItems    = [];
let allKits     = [];
let allVessels  = [];
let activeTab   = 'items';
let activeCat   = '';
let searchQuery = '';
let editingItemId   = null;
let editingKitId    = null;
let editingVesselId = null;
let detailItem  = null;

// ── Shell init ──
HILShell.init({
  toolId:      'vault',
  toolName:    'HL Vault',
  requireAuth: true,
  allowBrowse: false,
  onAuth:      handleAuth,
});

function handleAuth(user) {
  if (!user) {
    clearUI();
    return;
  }
  loadItems(user.uid);
  loadKits(user.uid);
  loadVessels(user.uid);
}

// ── Data loaders ──
function loadItems(uid) {
  window.db.collection('users').doc(uid)
    .collection('item_records')
    .onSnapshot(snap => {
      allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      allItems.sort((a,b) => {
        const ta = a.updated_at?.toMillis?.() || a.created_at?.toMillis?.() || 0;
        const tb = b.updated_at?.toMillis?.() || b.created_at?.toMillis?.() || 0;
        return tb - ta;
      });
      updateStats();
      renderItems();
    }, err => {
      HILShell.toast('Error loading items: ' + err.message, 'error');
    });
}

function loadKits(uid) {
  window.db.collection('users').doc(uid)
    .collection('kits')
    .onSnapshot(snap => {
      allKits = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderKits();
      updateStats();
    });
}

function loadVessels(uid) {
  window.db.collection('users').doc(uid)
    .collection('vessels')
    .onSnapshot(snap => {
      allVessels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderVessels();
    });
}

// ── Stats ──
function updateStats() {
  const active   = allItems.filter(i => i.status === 'active').length;
  const estValue = allItems.reduce((sum, i) => sum + (i.financial?.current_value || 0), 0);

  document.getElementById('stat-total').textContent  = allItems.length;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-kits').textContent   = allKits.length;
  document.getElementById('stat-value').textContent  =
    estValue > 0 ? '$' + Math.round(estValue).toLocaleString() : '—';
}

// ── Render items ──
function renderItems() {
  const q   = searchQuery.toLowerCase();
  const cat = activeCat;
  const filtered = allItems.filter(i => {
    const matchCat  = !cat || i.category === cat;
    const matchQ    = !q || (i.display_name||'').toLowerCase().includes(q)
                          || (i.hl_address||'').toLowerCase().includes(q)
                          || (i.category||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  const list = document.getElementById('item-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="hil-empty"><div class="hil-empty-icon">🗄</div>${allItems.length ? 'No items match your filter.' : 'No items yet. Add your first.'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(item => `
    <div class="item-row" data-id="${item.id}">
      <div class="item-thumb">
        ${item.hero_photo
          ? `<img src="${item.hero_photo}" alt="" loading="lazy">`
          : categoryIcon(item.category)}
      </div>
      <div class="item-info">
        <div class="item-name">${esc(item.display_name || item.name || 'Unnamed')}</div>
        <div class="item-meta">
          ${item.hl_address ? `<span class="item-address">${esc(item.hl_address)}</span>` : ''}
          <span class="item-category">${(item.category||'').toUpperCase()}</span>
          ${item.manufacturer ? `<span class="item-category">${esc(item.manufacturer)}</span>` : ''}
        </div>
      </div>
      <div class="item-status-col">
        <span class="hil-badge ${statusBadgeClass(item.status)}">${(item.status||'active').toUpperCase()}</span>
      </div>
      <div class="item-actions">
        <button class="icon-btn" data-edit="${item.id}" title="Edit">✏</button>
      </div>
    </div>
  `).join('');

  // Row click → detail; edit btn click → edit modal
  list.querySelectorAll('.item-row').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.dataset.edit) { openEditItem(e.target.dataset.edit); return; }
      const id = row.dataset.id;
      const item = allItems.find(i => i.id === id);
      if (item) openDetailModal(item);
    });
  });
}

// ── Render kits ──
function renderKits() {
  const q = (document.getElementById('kit-search')?.value || '').toLowerCase();
  const filtered = allKits.filter(k =>
    !q || (k.name||'').toLowerCase().includes(q) || (k.kit_id||'').toLowerCase().includes(q)
  );
  const grid = document.getElementById('kit-grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="hil-empty"><div class="hil-empty-icon">🧰</div>${allKits.length ? 'No kits match.' : 'No kits yet.'}</div>`;
    return;
  }
  grid.innerHTML = filtered.map(k => `
    <div class="kit-card" data-kit-id="${k.id}">
      <div class="kit-id">${esc(k.kit_id||k.id)}</div>
      <div class="kit-name">${esc(k.name||'Unnamed Kit')}</div>
      <div class="kit-meta">
        ${(k.domain||'').replace(/_/g,' ').toUpperCase()} · TIER ${k.tier||'—'}
        ${k.hl_address ? ` · <span style="color:var(--hil-green)">${esc(k.hl_address)}</span>` : ''}
      </div>
      <div class="kit-status-row">
        <span class="hil-badge ${statusBadgeClass(k.status)}">${(k.status||'active').toUpperCase()}</span>
        <button class="icon-btn" data-edit-kit="${k.id}" title="Edit">✏</button>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('[data-edit-kit]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openEditKit(btn.dataset.editKit);
    });
  });
}

// ── Render vessels ──
function renderVessels() {
  const q = (document.getElementById('vessel-search')?.value || '').toLowerCase();
  const filtered = allVessels.filter(v =>
    !q || (v.name||'').toLowerCase().includes(q) || (v.vessel_id||'').toLowerCase().includes(q)
  );
  const list = document.getElementById('vessel-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="hil-empty"><div class="hil-empty-icon">📦</div>${allVessels.length ? 'No vessels match.' : 'No vessels yet.'}</div>`;
    return;
  }

  const fillColor = { full: 'green', medium: '', low: 'amber', empty: 'red' };
  list.innerHTML = filtered.map(v => `
    <div class="item-row" style="grid-template-columns:1fr auto auto">
      <div class="item-info">
        <div class="item-name">${esc(v.name||v.vessel_id||'Unnamed')}</div>
        <div class="item-meta">
          <span class="item-category">${esc(v.vessel_id||'')} · ${esc(v.prefix||'')}</span>
          ${v.hl_address ? `<span class="item-address">${esc(v.hl_address)}</span>` : ''}
          ${v.kit_id ? `<span class="item-category">KIT: ${esc(v.kit_id)}</span>` : ''}
        </div>
      </div>
      <span class="hil-badge ${fillColor[v.fill_level]||''}">${(v.fill_level||'—').toUpperCase()}</span>
      <button class="icon-btn" data-edit-vessel="${v.id}" title="Edit">✏</button>
    </div>
  `).join('');

  list.querySelectorAll('[data-edit-vessel]').forEach(btn => {
    btn.addEventListener('click', () => openEditVessel(btn.dataset.editVessel));
  });
}

// ── Detail modal ──
function openDetailModal(item) {
  detailItem = item;
  document.getElementById('detail-modal-title').textContent =
    (item.display_name || item.name || 'ITEM').toUpperCase();

  const body = document.getElementById('detail-modal-body');
  const fin  = item.financial || {};
  const loc  = item.location  || {};
  const disp = item.display   || {};

  body.innerHTML = `
    <div class="detail-hero">
      ${item.hero_photo ? `<img src="${item.hero_photo}" alt="">` : categoryIcon(item.category)}
    </div>

    <div class="detail-section">
      <div class="hil-section-label">IDENTITY</div>
      ${dr('HL ADDRESS', item.hl_address ? `<span class="hil-address-chip">${esc(item.hl_address)}</span>` : '—')}
      ${dr('CATEGORY',   esc(item.category||'—'))}
      ${dr('STATUS',     `<span class="hil-badge ${statusBadgeClass(item.status)}">${(item.status||'active').toUpperCase()}</span>`)}
      ${dr('MANUFACTURER', esc(item.manufacturer||'—'))}
      ${dr('YEAR MADE',    esc(item.year_made||'—'))}
      ${dr('CONDITION',    esc(item.condition||'—'))}
    </div>

    ${item.description ? `<div class="detail-section"><div class="hil-section-label">DESCRIPTION</div><p style="font-size:13px;color:var(--hil-text-dim);line-height:1.6">${esc(item.description)}</p></div>` : ''}

    ${item.provenance ? `<div class="detail-section"><div class="hil-section-label">PROVENANCE</div><p style="font-size:13px;color:var(--hil-text-dim);line-height:1.6">${esc(item.provenance)}</p></div>` : ''}

    <div class="detail-section">
      <div class="hil-section-label">FINANCIAL</div>
      ${dr('PURCHASE PRICE',  fin.purchase_price != null ? '$' + fin.purchase_price.toLocaleString() : '—')}
      ${dr('CURRENT VALUE',   fin.current_value  != null ? '$' + fin.current_value.toLocaleString()  : '—')}
      ${dr('PURCHASE SOURCE', esc(fin.purchase_source||'—'))}
    </div>

    ${item.kit_memberships?.length ? `
    <div class="detail-section">
      <div class="hil-section-label">KIT MEMBERSHIPS</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${item.kit_memberships.map(k => `<span class="hil-badge green">${esc(k)}</span>`).join('')}
      </div>
    </div>` : ''}

    <div class="detail-section">
      <div class="hil-section-label">DISPLAY FLAGS</div>
      <div class="display-flags">
        ${Object.entries(disp).map(([k,v]) =>
          `<span class="hil-badge ${v ? 'green' : ''}">${k.replace('_','-').toUpperCase()}</span>`
        ).join('')}
      </div>
    </div>
  `;

  openModal('detail-modal');
}

// ── Add / Edit item ──
function openAddItem() {
  editingItemId = null;
  document.getElementById('item-modal-title').textContent = 'ADD ITEM';
  clearItemForm();
  openModal('item-modal');
}

function openEditItem(id) {
  const item = allItems.find(i => i.id === id);
  if (!item) return;
  editingItemId = id;
  document.getElementById('item-modal-title').textContent = 'EDIT ITEM';
  fillItemForm(item);
  openModal('item-modal');
  closeModal('detail-modal');
}

function clearItemForm() {
  ['f-display-name','f-hl-address','f-manufacturer','f-year-made',
   'f-description','f-provenance','f-narrative','f-purchase-source',
   'f-kit-memberships'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  ['f-purchase-price','f-current-value'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  setSelect('f-category','tool');
  setSelect('f-status','active');
  setSelect('f-condition','unknown');
  setCheck('f-flag-vault', true);
  ['f-flag-wunderkammer','f-flag-history-wall','f-flag-exchange','f-flag-family-ledger']
    .forEach(id => setCheck(id, false));
}

function fillItemForm(item) {
  setVal('f-display-name',    item.display_name||'');
  setVal('f-hl-address',      item.hl_address||'');
  setVal('f-manufacturer',    item.manufacturer||'');
  setVal('f-year-made',       item.year_made||'');
  setVal('f-description',     item.description||'');
  setVal('f-provenance',      item.provenance||'');
  setVal('f-narrative',       item.narrative||'');
  setSelect('f-category',     item.category||'tool');
  setSelect('f-status',       item.status||'active');
  setSelect('f-condition',    item.condition||'unknown');
  setVal('f-purchase-price',  item.financial?.purchase_price ?? '');
  setVal('f-current-value',   item.financial?.current_value  ?? '');
  setVal('f-purchase-source', item.financial?.purchase_source||'');
  setVal('f-kit-memberships', (item.kit_memberships||[]).join(', '));
  const d = item.display || {};
  setCheck('f-flag-vault',          d.vault         ?? true);
  setCheck('f-flag-wunderkammer',   d.wunderkammer  ?? false);
  setCheck('f-flag-history-wall',   d.history_wall  ?? false);
  setCheck('f-flag-exchange',       d.exchange       ?? false);
  setCheck('f-flag-family-ledger',  d.family_ledger ?? false);
}

async function saveItem() {
  const user = window.currentUser;
  if (!user) { HILShell.toast('Not signed in', 'error'); return; }

  const displayName = document.getElementById('f-display-name').value.trim();
  if (!displayName) { HILShell.toast('Display name is required', 'warn'); return; }

  const kitsRaw = document.getElementById('f-kit-memberships').value;
  const kitMemberships = kitsRaw ? kitsRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];

  const purchasePrice = parseFloat(document.getElementById('f-purchase-price').value) || null;
  const currentValue  = parseFloat(document.getElementById('f-current-value').value)  || null;

  const data = {
    display_name:    displayName,
    hl_address:      document.getElementById('f-hl-address').value.trim() || null,
    category:        document.getElementById('f-category').value,
    status:          document.getElementById('f-status').value,
    condition:       document.getElementById('f-condition').value,
    manufacturer:    document.getElementById('f-manufacturer').value.trim() || null,
    year_made:       document.getElementById('f-year-made').value.trim()    || null,
    description:     document.getElementById('f-description').value.trim()  || null,
    provenance:      document.getElementById('f-provenance').value.trim()   || null,
    narrative:       document.getElementById('f-narrative').value.trim()    || null,
    kit_memberships: kitMemberships,
    display: {
      vault:          document.getElementById('f-flag-vault').checked,
      wunderkammer:   document.getElementById('f-flag-wunderkammer').checked,
      history_wall:   document.getElementById('f-flag-history-wall').checked,
      brag_shelf:     false,
      exchange:       document.getElementById('f-flag-exchange').checked,
      sign_studio:    false,
      family_ledger:  document.getElementById('f-flag-family-ledger').checked,
    },
    financial: {
      purchase_price:  purchasePrice,
      current_value:   currentValue,
      purchase_source: document.getElementById('f-purchase-source').value.trim() || null,
    },
    owner_uid:  user.uid,
    updated_at: firebase.firestore.FieldValue.serverTimestamp(),
  };

  const btn = document.getElementById('save-item-btn');
  btn.disabled = true; btn.textContent = 'SAVING…';

  try {
    const col = window.db.collection('users').doc(user.uid).collection('item_records');
    if (editingItemId) {
      await col.doc(editingItemId).update(data);
      HILShell.toast('Item updated');
    } else {
      data.created_at = firebase.firestore.FieldValue.serverTimestamp();
      await col.add(data);
      HILShell.toast('Item added');
    }
    closeModal('item-modal');
  } catch (err) {
    HILShell.toast('Save failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'SAVE ITEM';
  }
}

async function deleteItem() {
  if (!detailItem) return;
  if (!confirm(`Delete "${detailItem.display_name||detailItem.name}"? This cannot be undone.`)) return;
  const user = window.currentUser;
  try {
    await window.db.collection('users').doc(user.uid)
      .collection('item_records').doc(detailItem.id).delete();
    HILShell.toast('Item deleted');
    closeModal('detail-modal');
    detailItem = null;
  } catch (err) {
    HILShell.toast('Delete failed: ' + err.message, 'error');
  }
}

// ── Kit modal ──
function openAddKit() {
  editingKitId = null;
  document.getElementById('kit-modal-title').textContent = 'ADD KIT';
  ['k-kit-id','k-name','k-hl-address','k-capabilities'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  setSelect('k-prefix','TK'); setSelect('k-domain','domestic_culinary');
  setSelect('k-tier','2'); setSelect('k-status','active');
  openModal('kit-modal');
}

function openEditKit(id) {
  const kit = allKits.find(k => k.id === id);
  if (!kit) return;
  editingKitId = id;
  document.getElementById('kit-modal-title').textContent = 'EDIT KIT';
  setVal('k-kit-id',       kit.kit_id||'');
  setVal('k-name',         kit.name||'');
  setVal('k-hl-address',   kit.hl_address||'');
  setVal('k-capabilities', (kit.capabilities||[]).join('\n'));
  setSelect('k-prefix', kit.prefix||'TK');
  setSelect('k-domain', kit.domain||'domestic_culinary');
  setSelect('k-tier',   String(kit.tier||2));
  setSelect('k-status', kit.status||'active');
  openModal('kit-modal');
}

async function saveKit() {
  const user = window.currentUser;
  if (!user) { HILShell.toast('Not signed in', 'error'); return; }
  const kitId = document.getElementById('k-kit-id').value.trim();
  const name  = document.getElementById('k-name').value.trim();
  if (!kitId || !name) { HILShell.toast('Kit ID and name required', 'warn'); return; }

  const capsRaw = document.getElementById('k-capabilities').value;
  const capabilities = capsRaw ? capsRaw.split('\n').map(s=>s.trim()).filter(Boolean) : [];

  const data = {
    kit_id:       kitId,
    prefix:       document.getElementById('k-prefix').value,
    name:         name,
    domain:       document.getElementById('k-domain').value,
    tier:         parseInt(document.getElementById('k-tier').value),
    status:       document.getElementById('k-status').value,
    hl_address:   document.getElementById('k-hl-address').value.trim() || null,
    capabilities: capabilities,
    owner_uid:    user.uid,
    updated_at:   firebase.firestore.FieldValue.serverTimestamp(),
  };

  const btn = document.getElementById('save-kit-btn');
  btn.disabled = true; btn.textContent = 'SAVING…';

  try {
    const col = window.db.collection('users').doc(user.uid).collection('kits');
    if (editingKitId) {
      await col.doc(editingKitId).update(data);
      HILShell.toast('Kit updated');
    } else {
      data.created_at = firebase.firestore.FieldValue.serverTimestamp();
      await col.add(data);
      HILShell.toast('Kit added');
    }
    closeModal('kit-modal');
  } catch (err) {
    HILShell.toast('Save failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'SAVE KIT';
  }
}

// ── Vessel modal ──
function openAddVessel() {
  editingVesselId = null;
  ['v-vessel-id','v-name','v-hl-address','v-home-address','v-kit-id']
    .forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
  setSelect('v-prefix','MS'); setSelect('v-fill-level','medium');
  openModal('vessel-modal');
}

function openEditVessel(id) {
  const v = allVessels.find(x => x.id === id);
  if (!v) return;
  editingVesselId = id;
  setVal('v-vessel-id',   v.vessel_id||'');
  setVal('v-name',        v.name||'');
  setVal('v-hl-address',  v.hl_address||'');
  setVal('v-home-address',v.home_address||'');
  setVal('v-kit-id',      v.kit_id||'');
  setSelect('v-prefix',     v.prefix||'MS');
  setSelect('v-fill-level', v.fill_level||'medium');
  openModal('vessel-modal');
}

async function saveVessel() {
  const user = window.currentUser;
  if (!user) { HILShell.toast('Not signed in', 'error'); return; }
  const vesselId = document.getElementById('v-vessel-id').value.trim();
  const name     = document.getElementById('v-name').value.trim();
  if (!vesselId || !name) { HILShell.toast('Vessel ID and name required', 'warn'); return; }

  const data = {
    vessel_id:    vesselId,
    prefix:       document.getElementById('v-prefix').value,
    name:         name,
    hl_address:   document.getElementById('v-hl-address').value.trim()   || null,
    home_address: document.getElementById('v-home-address').value.trim() || null,
    kit_id:       document.getElementById('v-kit-id').value.trim()       || null,
    fill_level:   document.getElementById('v-fill-level').value,
    owner_uid:    user.uid,
    updated_at:   firebase.firestore.FieldValue.serverTimestamp(),
  };

  const btn = document.getElementById('save-vessel-btn');
  btn.disabled = true; btn.textContent = 'SAVING…';

  try {
    const col = window.db.collection('users').doc(user.uid).collection('vessels');
    if (editingVesselId) {
      await col.doc(editingVesselId).update(data);
      HILShell.toast('Vessel updated');
    } else {
      data.created_at = firebase.firestore.FieldValue.serverTimestamp();
      await col.add(data);
      HILShell.toast('Vessel added');
    }
    closeModal('vessel-modal');
  } catch (err) {
    HILShell.toast('Save failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'SAVE VESSEL';
  }
}

// ── Tab switching ──
document.querySelectorAll('.vault-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    activeTab = tab.dataset.tab;
    document.querySelectorAll('.vault-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    ['items','kits','vessels'].forEach(t => {
      document.getElementById('tab-' + t).style.display = t === activeTab ? '' : 'none';
    });
  });
});

// ── Search ──
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderItems();
});
document.getElementById('kit-search').addEventListener('input', () => renderKits());
document.getElementById('vessel-search').addEventListener('input', () => renderVessels());

// ── Category filters ──
document.getElementById('category-filters').addEventListener('click', e => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeCat = chip.dataset.cat;
  renderItems();
});

// ── Button wiring ──
document.getElementById('add-item-btn').addEventListener('click', openAddItem);
document.getElementById('save-item-btn').addEventListener('click', saveItem);
document.getElementById('detail-edit-btn').addEventListener('click', () => {
  if (detailItem) openEditItem(detailItem.id);
});
document.getElementById('detail-delete-btn').addEventListener('click', deleteItem);
document.getElementById('add-kit-btn').addEventListener('click', openAddKit);
document.getElementById('save-kit-btn').addEventListener('click', saveKit);
document.getElementById('add-vessel-btn').addEventListener('click', openAddVessel);
document.getElementById('save-vessel-btn').addEventListener('click', saveVessel);

// ── Modal helpers ──
function openModal(id) {
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// Close buttons (data-close attribute)
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});
// Click overlay to close
document.querySelectorAll('.hil-modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ── Clear on sign-out ──
function clearUI() {
  allItems = []; allKits = []; allVessels = [];
  ['item-list','kit-grid','vessel-list'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '<div class="hil-empty">Sign in to view your inventory.</div>';
  });
  ['stat-total','stat-active','stat-kits'].forEach(id => {
    const el = document.getElementById(id); if (el) el.textContent = '—';
  });
}

// ── Helpers ──
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function dr(key, val) {
  return `<div class="detail-row"><span class="detail-key">${key}</span><span class="detail-val">${val}</span></div>`;
}
function setVal(id, val)    { const el=document.getElementById(id); if(el) el.value = val; }
function setSelect(id, val) { const el=document.getElementById(id); if(el) el.value = val; }
function setCheck(id, v)    { const el=document.getElementById(id); if(el) el.checked = !!v; }

function statusBadgeClass(status) {
  return { active:'green', transferred:'', donated:'amber', passed_on:'', lost:'red' }[status] || '';
}

function categoryIcon(cat) {
  return { tool:'🔧', collectible:'🏺', heirloom:'🪆', ephemera:'📄',
           media:'📼', artwork:'🖼', document:'📋', specimen:'🔬', other:'📦' }[cat] || '📦';
}
</script>
