<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIL Sign Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel:wght@700;900&family=Orbitron:wght@700;900&family=Bebas+Neue&family=IM+Fell+English:ital@0;1&display=swap');

:root {
  --bg: #0d0f12;
  --panel: #13171c;
  --border: #1e2530;
  --accent: #00e5ff;
  --accent2: #c8a84b;
  --text: #c8d8e8;
  --dim: #4a5a6a;
  --red: #cc2200;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  padding: 16px;
}

body::before {
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,255,0.012) 2px,rgba(0,229,255,0.012) 4px);
  pointer-events:none;z-index:9999;
}

header {
  display:flex;align-items:center;gap:12px;
  margin-bottom:18px;padding-bottom:14px;
  border-bottom:1px solid var(--border);
}

.logo-wrap { display:flex;align-items:center;gap:10px; }
.logo-img { width:38px;height:38px;opacity:0.9; }

.title-block .t1 {
  font-family:'Orbitron',monospace;
  font-size:20px;font-weight:900;
  color:var(--accent);letter-spacing:3px;
  text-shadow:0 0 18px rgba(0,229,255,0.35);
}
.title-block .t1 span { color:var(--accent2); }
.title-block .t2 {
  font-size:10px;color:var(--dim);
  letter-spacing:2px;text-transform:uppercase;margin-top:1px;
}

/* Theme selector */
.theme-tabs {
  display:flex;gap:4px;margin-bottom:16px;
  background:var(--panel);padding:4px;
  border-radius:6px;border:1px solid var(--border);
}
.ttab {
  flex:1;padding:9px 4px;
  background:transparent;border:none;
  color:var(--dim);font-family:'Share Tech Mono',monospace;
  font-size:12px;cursor:pointer;border-radius:4px;
  transition:all 0.2s;letter-spacing:1px;text-transform:uppercase;
}
.ttab.active { background:var(--accent);color:#000;font-weight:700; }

/* Form */
.field { margin-bottom:11px; }
label {
  display:block;font-size:10px;color:var(--accent);
  letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;
}
input, select, textarea {
  width:100%;background:var(--panel);
  border:1px solid var(--border);color:var(--text);
  font-family:'Share Tech Mono',monospace;font-size:14px;
  padding:9px 11px;border-radius:4px;outline:none;
  transition:border-color 0.2s;
}
input:focus,select:focus { border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,229,255,0.1); }
select option { background:#111; }

.row2 { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
.row3 { display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px; }

/* Compass picker */
.compass-grid {
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  max-width:180px;
}
.compass-btn {
  padding:8px;background:var(--panel);border:1px solid var(--border);
  color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:13px;
  cursor:pointer;border-radius:4px;transition:all 0.2s;text-align:center;
}
.compass-btn.active { border-color:var(--accent2);color:var(--accent2);background:rgba(200,168,75,0.1); }
.compass-center { background:rgba(0,229,255,0.05)!important; }

/* QR toggle */
.toggle-row { display:flex;gap:8px;margin-bottom:12px; }
.tgl {
  flex:1;padding:8px;background:var(--panel);border:1px solid var(--border);
  color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:11px;
  cursor:pointer;border-radius:4px;transition:all 0.2s;text-align:center;letter-spacing:1px;
}
.tgl.on { border-color:var(--accent2);color:var(--accent2);background:rgba(200,168,75,0.08); }

/* Buttons */
.btn-row { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px; }
.btn {
  padding:12px;border:none;border-radius:4px;
  font-family:'Share Tech Mono',monospace;font-size:14px;font-weight:700;
  letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:all 0.2s;
}
.btn-go { background:var(--accent);color:#000; }
.btn-clr { background:var(--panel);color:var(--accent2);border:1px solid var(--accent2); }
.btn:active { transform:scale(0.97); }

/* Preview */
#preview { margin-top:20px;border-top:1px solid var(--border);padding-top:16px;display:none; }
#preview.on { display:block; }
.prev-lbl { font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px; }

/* ========== SIGN STYLES ========== */

/* --- ART DECO --- */
.sign-deco {
  background: linear-gradient(145deg,#c8a84b,#e8c96a,#a07828,#c8a84b);
  border-radius:8px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.3);
  font-family:'Cinzel',serif;color:#1a1208;
  position:relative;
}
.sign-deco::before {
  content:'';position:absolute;inset:6px;
  border:2px solid rgba(26,18,8,0.4);border-radius:4px;
  pointer-events:none;z-index:1;
}
.deco-header {
  background:rgba(26,18,8,0.85);color:#c8a84b;
  padding:8px 16px;font-size:9px;letter-spacing:4px;
  text-align:center;border-bottom:1px solid rgba(200,168,75,0.3);
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.deco-eye { font-size:12px; }
.deco-body {
  display:flex;align-items:center;padding:14px 16px;gap:14px;
  position:relative;z-index:2;
}
.deco-center { flex:1;text-align:center; }
.deco-zone-name {
  font-size:22px;font-weight:900;letter-spacing:2px;
  text-transform:uppercase;line-height:1;color:#1a1208;
  text-shadow:0 1px 0 rgba(255,255,255,0.4);
}
.deco-addr {
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:rgba(26,18,8,0.7);
  margin-top:4px;letter-spacing:2px;
}
.deco-wall-badge {
  font-size:9px;letter-spacing:3px;
  background:rgba(26,18,8,0.2);
  padding:3px 8px;border-radius:2px;margin-top:6px;display:inline-block;
}
.deco-footer {
  background:rgba(26,18,8,0.7);padding:5px 16px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:8px;color:#c8a84b;letter-spacing:2px;
  border-top:1px solid rgba(200,168,75,0.3);
}
.deco-compass-ring {
  width:64px;height:64px;flex-shrink:0;
  position:relative;
}
.deco-compass-svg { width:100%;height:100%; }

/* --- VINTAGE TIN --- */
.sign-tin {
  background: linear-gradient(135deg,#f5f0e8,#e8dfc8,#f0e8d4);
  border-radius:6px;overflow:hidden;
  border:3px solid #8b6914;
  box-shadow: 0 6px 24px rgba(0,0,0,0.6),
              inset 0 0 0 2px rgba(255,255,255,0.5),
              4px 4px 0 #5a4010;
  font-family:'Bebas Neue',sans-serif;
  position:relative;
}
.tin-corner {
  position:absolute;width:10px;height:10px;
  background:#8b6914;border-radius:50%;
  box-shadow:0 0 0 2px #c8a84b;z-index:5;
}
.tin-corner.tl { top:6px;left:6px; }
.tin-corner.tr { top:6px;right:6px; }
.tin-corner.bl { bottom:6px;left:6px; }
.tin-corner.br { bottom:6px;right:6px; }
.tin-stripe-top {
  background:#1a3a5c;padding:6px 20px;
  font-size:11px;letter-spacing:3px;color:#f5f0e8;
  text-align:center;border-bottom:2px solid #8b6914;
}
.tin-body { padding:12px 16px;display:flex;align-items:center;gap:12px; }
.tin-main { flex:1; }
.tin-zone {
  font-size:32px;line-height:1;color:#1a3a5c;
  text-shadow:2px 2px 0 rgba(0,0,0,0.15);letter-spacing:1px;
}
.tin-desc {
  font-family:'Share Tech Mono',monospace;
  font-size:11px;color:#5a4010;margin-top:3px;letter-spacing:1px;
}
.tin-addr {
  font-family:'Share Tech Mono',monospace;
  font-size:10px;color:#8b6914;letter-spacing:2px;
}
.tin-banner {
  background:#cc2200;padding:5px 20px;
  font-size:10px;letter-spacing:3px;color:#f5f0e8;
  text-align:center;border-top:2px solid #8b6914;
  text-shadow:1px 1px 0 rgba(0,0,0,0.4);
}
.tin-sub {
  background:#1a3a5c;padding:3px 20px;
  font-size:8px;letter-spacing:2px;color:#c8d8e8;text-align:center;
}

/* --- INDUSTRIAL --- */
.sign-industrial {
  background:#111418;
  border:1px solid #2a3540;
  border-left:5px solid var(--accent);
  border-radius:4px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
  font-family:'Share Tech Mono',monospace;
}
.ind-header {
  background:#0a0c10;padding:7px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #1e2530;
}
.ind-sys { font-size:9px;color:var(--accent);letter-spacing:3px; }
.ind-date { font-size:9px;color:var(--dim); }
.ind-body { display:flex;align-items:center;padding:14px;gap:14px; }
.ind-logo-wrap { opacity:0.7; }
.ind-main { flex:1; }
.ind-zone {
  font-family:'Orbitron',monospace;
  font-size:20px;font-weight:900;color:#fff;
  letter-spacing:2px;line-height:1;
}
.ind-desc { font-size:12px;color:var(--text);margin-top:3px;letter-spacing:1px; }
.ind-addr { font-size:10px;color:var(--accent);margin-top:2px;letter-spacing:2px; }
.ind-wall-tag {
  display:inline-block;background:var(--accent);color:#000;
  font-size:9px;padding:2px 6px;border-radius:2px;
  margin-top:5px;letter-spacing:2px;font-weight:700;
}
.ind-footer {
  background:#0a0c10;padding:5px 14px;
  display:flex;justify-content:space-between;
  font-size:9px;color:var(--dim);letter-spacing:1px;
  border-top:1px solid #1e2530;
}

/* Save/copy */
.action-btn {
  width:100%;margin-top:8px;padding:10px;
  background:rgba(0,229,255,0.08);border:1px solid var(--accent);
  color:var(--accent);font-family:'Share Tech Mono',monospace;
  font-size:13px;cursor:pointer;border-radius:4px;
  letter-spacing:1px;transition:all 0.2s;text-transform:uppercase;
}
.action-btn:active { background:rgba(0,229,255,0.2); }

.toast {
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#00ff88;color:#000;padding:10px 24px;border-radius:4px;
  font-family:'Share Tech Mono',monospace;font-weight:700;font-size:13px;
  letter-spacing:1px;opacity:0;transition:opacity 0.3s;z-index:10000;
}
.toast.show { opacity:1; }

.qr-wrap { flex-shrink:0; }
</style>
</head>

let theme = 'deco';
let wall = '';
let qrMode = 'addr';

function setTheme(t, btn) {
  theme = t;
  document.querySelectorAll('.ttab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function setWall(w, btn) {
  wall = w;
  document.querySelectorAll('.compass-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function setQR(m, btn) {
  qrMode = m;
  document.querySelectorAll('.tgl').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('url-wrap').style.display = m === 'url' ? 'block' : 'none';
}

function getQRData() {
  if (qrMode === 'url') {
    const u = document.getElementById('f-url').value;
    return u || document.getElementById('f-addr').value || 'HIL';
  }
  return document.getElementById('f-addr').value || 'HIL';
}

function makeQR(container, data, size) {
  container.innerHTML = '';
  new QRCode(container, {
    text: data || 'HIL', width: size, height: size,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
}

function makeCompassSVG(wall, color, bg) {
  const dirs = ['N','E','S','W'];
  const angles = {N:0, E:90, S:180, W:270, C:0};
  const highlight = wall ? wall : '';
  const c = color || '#c8a84b';
  const b = bg || 'rgba(26,18,8,0.15)';
  return `<svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="30" cy="30" r="28" stroke="${c}" stroke-width="1.5" fill="${b}" stroke-dasharray="3 3"/>
    <polygon points="30,4 33,28 30,32 27,28" fill="${highlight==='N'?c:'rgba(200,168,75,0.3)'}"/>
    <polygon points="56,30 32,27 28,30 32,33" fill="${highlight==='E'?c:'rgba(200,168,75,0.25)'}"/>
    <polygon points="30,56 27,32 30,28 33,32" fill="${highlight==='S'?c:'rgba(200,168,75,0.25)'}"/>
    <polygon points="4,30 28,33 32,30 28,27" fill="${highlight==='W'?c:'rgba(200,168,75,0.25)'}"/>
    <circle cx="30" cy="30" r="4" fill="${c}" stroke="#fff" stroke-width="1"/>
    ${dirs.map(d=>{
      const px={N:'30,10',E:'50,30',S:'30,50',W:'10,30'}[d];
      return `<text x="${px.split(',')[0]}" y="${parseInt(px.split(',')[1])+4}" text-anchor="middle" font-size="8" fill="${d===highlight?c:'rgba(200,168,75,0.5)'}" font-family="Share Tech Mono,monospace" font-weight="${d===highlight?'700':'400'}">${d}</text>`;
    }).join('')}
  </svg>`;
}

function generate() {
  const zone = document.getElementById('f-zone').value || 'ZONE';
  const addr = document.getElementById('f-addr').value || '—';
  const tag = document.getElementById('f-tag').value;
  const qrData = getQRData();
  const date = new Date().toLocaleDateString();

  const out = document.getElementById('sign-out');
  out.innerHTML = '';

  let html = '';
  if (theme === 'deco') html = buildDeco(zone, addr, tag, date);
  else if (theme === 'tin') html = buildTin(zone, addr, tag, date);
  else html = buildInd(zone, addr, tag, date);

  out.innerHTML = html;

  document.getElementById('preview').classList.add('on');

  setTimeout(() => {
    const qEl = document.getElementById('sign-qr');
    if (qEl) makeQR(qEl, qrData, 64);
  }, 60);
}

function buildDeco(zone, addr, tag, date) {
  const compassSVG = makeCompassSVG(wall, '#c8a84b', 'rgba(26,18,8,0.15)');
  const wallTxt = wall ? 'WALL: ' + wall : '';
  return `
  <div class="sign-deco">
    <div class="deco-header">
      <span class="deco-eye">◈</span>
      <span style="letter-spacing:4px;font-size:9px;">HIL ∙ HOME INVENTORY LOCATOR</span>
      <span class="deco-eye">◈</span>
    </div>
    <div class="deco-body">
      <div style="flex-shrink:0;">${compassSVG.replace('viewBox','width="64" height="64" viewBox')}</div>
      <div class="deco-center">
        <div class="deco-zone-name">${zone}</div>
        ${tag ? `<div class="deco-addr">${tag}</div>` : ''}
        <div class="deco-addr" style="margin-top:5px;">${addr}</div>
        ${wallTxt ? `<div class="deco-wall-badge">${wallTxt}</div>` : ''}
      </div>
      <div class="qr-wrap">
        <div id="sign-qr" style="background:#fff;padding:3px;border-radius:3px;"></div>
      </div>
    </div>
    <div class="deco-footer">
      <span>◆ HL SYSTEM v1.0 ◆</span>
      <span style="font-family:'Share Tech Mono',monospace;font-size:8px;">${date}</span>
    </div>
  </div>`;
}

function buildTin(zone, addr, tag, date) {
  const compassSVG = makeCompassSVG(wall, '#1a3a5c', 'rgba(26,58,92,0.1)');
  return `
  <div class="sign-tin">
    <div class="tin-corner tl"></div>
    <div class="tin-corner tr"></div>
    <div class="tin-corner bl"></div>
    <div class="tin-corner br"></div>
    <div class="tin-stripe-top">▸ HIL MASTER SYSTEM ◂ HOME INVENTORY LOCATOR</div>
    <div class="tin-body">
      <div style="flex-shrink:0;">
        <img src="${LOGO_B64}" width="52" height="52" style="opacity:0.85;">
      </div>
      <div class="tin-main">
        <div class="tin-zone">${zone}</div>
        ${tag ? `<div class="tin-desc">${tag}</div>` : ''}
        <div class="tin-addr">${addr}${wall ? ' ∙ WALL: '+wall : ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;">
        ${compassSVG.replace('viewBox','width="52" height="52" viewBox')}
        <div id="sign-qr" style="background:#fff;padding:2px;border-radius:2px;border:1px solid #8b6914;"></div>
      </div>
    </div>
    <div class="tin-banner">NOTHING IS LOST ∙ EVERYTHING IS LOGIC</div>
    <div class="tin-sub">HL SYSTEM v1.0 ∙ ${date}</div>
  </div>`;
}

function buildInd(zone, addr, tag, date) {
  const compassSVG = makeCompassSVG(wall, '#00e5ff', 'rgba(0,229,255,0.05)');
  return `
  <div class="sign-industrial">
    <div class="ind-header">
      <span class="ind-sys">▸ HIL MASTER SYSTEM</span>
      <span class="ind-date">${date}</span>
    </div>
    <div class="ind-body">
      <div class="ind-logo-wrap">
        <img src="${LOGO_B64}" width="48" height="48">
      </div>
      <div class="ind-main">
        <div class="ind-zone">${zone}</div>
        ${tag ? `<div class="ind-desc">${tag}</div>` : ''}
        <div class="ind-addr">${addr}</div>
        ${wall ? `<div class="ind-wall-tag">WALL: ${wall}</div>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;">
        ${compassSVG.replace('viewBox','width="56" height="56" viewBox')}
        <div id="sign-qr" style="background:#fff;padding:2px;border-radius:2px;"></div>
      </div>
    </div>
    <div class="ind-footer">
      <span>HL GRAMMAR v1.0</span>
      <span>EVERYTHING IS ADDRESSABLE</span>
    </div>
  </div>`;
}

function clearAll() {
  document.querySelectorAll('input').forEach(i => i.value = '');
  document.getElementById('preview').classList.remove('on');
  wall = '';
  document.querySelectorAll('.compass-btn').forEach(b => b.classList.remove('active'));
}

function printHint() {
  showToast('Use Ctrl+P or screenshot to save your sign');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
